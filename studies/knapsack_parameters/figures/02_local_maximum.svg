<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <rect x="0" y="0" width="1100" height="760" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-family="Segoe UI" font-size="28" font-weight="bold" fill="#20354b">Неглобальний локальний максимум</text>
  <text x="550" y="80" text-anchor="middle" font-family="Segoe UI" font-size="22" fill="#20354b">Навчальна задача: місткість 10</text>
  <rect x="90" y="120" width="920" height="90" fill="#f6f8fa" stroke="#334e68" stroke-width="2"/>
  <text x="550" y="157" text-anchor="middle" font-family="Segoe UI" font-size="23" fill="#20354b">А: вага 10, цінність 10</text>
  <text x="550" y="192" text-anchor="middle" font-family="Segoe UI" font-size="23" fill="#20354b">Б і В: кожен має вагу 5 та цінність 6</text>
  <rect x="90" y="272" width="360" height="115" fill="#eaf0f6" stroke="#334e68" stroke-width="3"/>
  <text x="270" y="312" text-anchor="middle" font-family="Segoe UI" font-size="28" font-weight="bold" fill="#20354b">Центр 100</text>
  <text x="270" y="350" text-anchor="middle" font-family="Segoe UI" font-size="23" fill="#20354b">Вага 10, цінність 10</text>
  <rect x="670" y="272" width="340" height="115" fill="#e8f4eb" stroke="#326749" stroke-width="3"/>
  <text x="840" y="312" text-anchor="middle" font-family="Segoe UI" font-size="28" font-weight="bold" fill="#20354b">Кращий набір 011</text>
  <text x="840" y="350" text-anchor="middle" font-family="Segoe UI" font-size="23" fill="#20354b">Вага 10, цінність 12</text>
  <line x1="450" y1="329" x2="656" y2="329" stroke="#326749" stroke-width="3"/>
  <polygon points="651,320 651,338 669,329" fill="#326749"/>
  <text x="558" y="260" text-anchor="middle" font-family="Segoe UI" font-size="23" fill="#20354b">Три зміни бітів</text>
  <text x="550" y="440" text-anchor="middle" font-family="Segoe UI" font-size="22" fill="#20354b">Усі допустимі сусіди центра на відстані до двох бітів:</text>
  <rect x="90" y="470" width="275" height="100" fill="#fff6e7" stroke="#8a6125" stroke-width="2"/>
  <text x="227" y="510" text-anchor="middle" font-family="Segoe UI" font-size="26" fill="#20354b">000</text>
  <text x="227" y="548" text-anchor="middle" font-family="Segoe UI" font-size="22" fill="#20354b">Вага 0, цінність 0</text>
  <rect x="412" y="470" width="275" height="100" fill="#fff6e7" stroke="#8a6125" stroke-width="2"/>
  <text x="549" y="510" text-anchor="middle" font-family="Segoe UI" font-size="26" fill="#20354b">010</text>
  <text x="549" y="548" text-anchor="middle" font-family="Segoe UI" font-size="22" fill="#20354b">Вага 5, цінність 6</text>
  <rect x="735" y="470" width="275" height="100" fill="#fff6e7" stroke="#8a6125" stroke-width="2"/>
  <text x="872" y="510" text-anchor="middle" font-family="Segoe UI" font-size="26" fill="#20354b">001</text>
  <text x="872" y="548" text-anchor="middle" font-family="Segoe UI" font-size="22" fill="#20354b">Вага 5, цінність 6</text>
  <text x="550" y="625" text-anchor="middle" font-family="Segoe UI" font-size="22" fill="#20354b">Додавання до А перевищує місткість, обмін зменшує цінність.</text>
  <text x="550" y="668" text-anchor="middle" font-family="Segoe UI" font-size="22" fill="#20354b">Локальний максимум визначається щодо конкретного сусідства.</text>
  <text x="550" y="718" text-anchor="middle" font-family="Segoe UI" font-size="20" fill="#20354b">Це пояснювальний приклад, не результат запуску на KPLIB.</text>
</svg>
