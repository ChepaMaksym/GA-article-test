name: Knapsack initial grid 100 - technical stage only

on:
  workflow_dispatch:
  push:
    branches: [research/initial-grid100-technical-20261110]
    paths:
      - studies/knapsack_parameters/initial_grid_100/**
      - .github/workflows/initial-grid-100-technical.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: initial-grid100-technical-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MPLBACKEND: Agg

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install frozen dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Check stage authority, sources, configurations and source-admission tests
        run: |
          python -c "from studies.knapsack_parameters.initial_grid_100.common import guard_stage; guard_stage('technical')"
          python -m unittest studies.knapsack_parameters.initial_grid_100.test_search studies.knapsack_parameters.initial_grid_100.test_preparation -v
      - name: Prepare technical banks and audit thirty validation tasks
        run: |
          python -m studies.knapsack_parameters.initial_grid_100.preparation --out "$RUNNER_TEMP/inputs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: initial-grid100-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/inputs
          retention-days: 30
          if-no-files-found: warn

  pilot:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        case: [n00100-UC-s000, n00100-WC-s001, n00100-SC-s005]
        mu: [15, 25]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: initial-grid100-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/inputs
      - name: Two registered technical crossovers
        run: |
          python -m studies.knapsack_parameters.initial_grid_100.pilot --inputs "$RUNNER_TEMP/inputs" --case ${{ matrix.case }} --mu ${{ matrix.mu }} --out "$RUNNER_TEMP/output"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: initial-grid100-technical-pilot-${{ matrix.case }}-mu${{ matrix.mu }}-${{ github.run_id }}
          path: ${{ runner.temp }}/output
          retention-days: 30
          if-no-files-found: warn

  compatibility:
    needs: [prepare, pilot]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        mu: [10, 20]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: initial-grid100-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/inputs
      - name: Authenticate retained references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m studies.knapsack_parameters.initial_grid_100.retained --mu ${{ matrix.mu }} --out "$RUNNER_TEMP/references"
      - name: Replay the three historical identities exactly
        run: |
          for case in n00100-UC-s000 n00100-WC-s001 n00100-SC-s005
          do
            python -m studies.knapsack_parameters.initial_grid_100.pilot --inputs "$RUNNER_TEMP/inputs" --case "$case" --mu ${{ matrix.mu }} --out "$RUNNER_TEMP/output/$case" --compatibility --references "$RUNNER_TEMP/references"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: initial-grid100-technical-compatibility-mu${{ matrix.mu }}-${{ github.run_id }}
          path: ${{ runner.temp }}/output
          retention-days: 30
          if-no-files-found: warn

  forecast:
    needs: [pilot, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: initial-grid100-technical-*-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
      - name: Verify all eighteen technical cases and forecast later stages
        run: |
          python -m studies.knapsack_parameters.initial_grid_100.forecast --artifacts "$RUNNER_TEMP/evidence" --out "$RUNNER_TEMP/forecast"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: initial-grid100-forecast-${{ github.run_id }}
          path: ${{ runner.temp }}/forecast
          retention-days: 30
          if-no-files-found: error
