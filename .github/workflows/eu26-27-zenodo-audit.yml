name: EU26-27 Zenodo artifact audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/EU26-27-agsemo-old-first
    paths:
      - 'candidates/EU26-27/**'
      - '.github/workflows/eu26-27-zenodo-audit.yml'

concurrency:
  group: eu26-27-zenodo-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Authenticate Zenodo record 7880836
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download, authenticate and inventory artifact
        env:
          EU2627_AUDIT_DIR: ${{ runner.temp }}/eu26-27-audit
        run: |
          python candidates/EU26-27/tools/audit_zenodo.py
      - name: Publish summary to job output
        if: always()
        run: |
          test -f "${RUNNER_TEMP}/eu26-27-audit/summary.md"
          cat "${RUNNER_TEMP}/eu26-27-audit/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: eu26-27-zenodo-7880836-audit
          path: ${{ runner.temp }}/eu26-27-audit
          if-no-files-found: error
          retention-days: 90
