name: Diversity crossover technical pilot

on:
  push:
    branches: [research/masters-ga-diversity-crossover]

permissions:
  contents: read
  actions: read

concurrency:
  group: diversity-crossover-technical-pilot
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.sha }}
  STUDY_WORKFLOW_SHA: ${{ github.sha }}
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  phase:
    if: contains(github.event.head_commit.message, '[diversity:')
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      phase: ${{ steps.authority.outputs.phase }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: authority
        name: Authorize exact phase and cumulative runner budget
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m studies.diversity_crossover.implementation.contract --output "$RUNNER_TEMP/budget"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diversity-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/budget
          if-no-files-found: warn
          retention-days: 90

  tests:
    needs: phase
    if: needs.phase.outputs.phase == 'tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install byte-pinned inherited environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Independent fixtures and versioned test receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m studies.diversity_crossover.implementation.ci_support tests --output "$RUNNER_TEMP/tests"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diversity-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tests
          if-no-files-found: warn
          retention-days: 90

  prepare:
    needs: phase
    if: needs.phase.outputs.phase == 'prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Prepare exactly sixteen verified starts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m studies.diversity_crossover.implementation.banks --expected-sha "$EXPECTED_SHA" --output "$RUNNER_TEMP/starts"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diversity-starts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/starts
          if-no-files-found: warn
          retention-days: 90

  pilot:
    name: pilot (${{ matrix.task }})
    needs: phase
    if: needs.phase.outputs.phase == 'pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        task: [Flat, OneMax, Jump4, Jump8, UC-s000, WC-s001, SC-s005, SC-s000]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Eight searches and independent reconstruction
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m studies.diversity_crossover.implementation.runner --task '${{ matrix.task }}' --expected-sha "$EXPECTED_SHA" --output "$RUNNER_TEMP/pilot"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diversity-pilot-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pilot
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90

  aggregate:
    needs: [phase, pilot]
    if: always() && needs.phase.outputs.phase == 'pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Verify source ZIP digests after every matrix job ended
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m studies.diversity_crossover.implementation.ci_support download --output "$RUNNER_TEMP/sources"
      - name: Aggregate complete and incomplete cases; fixed illustrative figures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m studies.diversity_crossover.implementation.reporting --expected-sha "$EXPECTED_SHA" --source "$RUNNER_TEMP/sources" --output "$RUNNER_TEMP/report"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diversity-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report
          if-no-files-found: warn
          retention-days: 90
