name: Verify paired donor schedules on old inputs
on:
  push:
    branches: [research/adaptive-threshold-validation]
    paths: [studies/knapsack_parameters/adaptive_threshold_validation/donor_replay.py]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --require-hashes -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - run: python -m unittest studies.knapsack_parameters.adaptive_threshold_validation.test_donor_replay
