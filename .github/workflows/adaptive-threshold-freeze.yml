name: Freeze paired adaptive finalists
on:
  workflow_dispatch:
  push:
    branches: [research/adaptive-threshold-validation]
    paths: [studies/knapsack_parameters/adaptive_threshold_validation/freeze-request.json]
permissions:
  actions: read
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --require-hashes -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - run: python -m unittest studies.knapsack_parameters.adaptive_threshold_validation.test_confirmatory
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45899446917
          name: screening-selection-45899446917-1
          path: prior
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45947756159
          name: followup-report
          path: follow
      - run: python -m studies.knapsack_parameters.adaptive_threshold_validation.freeze_finalists
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frozen-finalists
          path: frozen-roles.json
          if-no-files-found: error
