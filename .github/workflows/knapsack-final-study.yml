name: Knapsack final study - isolated checks and ten resource probes

on:
  push:
    branches: [research/masters-ga-diversity-crossover]

permissions:
  contents: read
  actions: read

concurrency:
  group: knapsack-final-study-resource-budget
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.sha }}
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  GITHUB_TOKEN: ${{ github.token }}
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  gate:
    if: contains(github.event.head_commit.message, '[knapsack-final:tests]') || contains(github.event.head_commit.message, '[knapsack-final:probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate frozen contract and reserve the complete phase
        env:
          FINAL_PHASE: ${{ contains(github.event.head_commit.message, '[knapsack-final:tests]') && 'tests' || 'probe' }}
        run: python3 -m studies.knapsack_parameters.final_study.execution gate --phase "$FINAL_PHASE" --output "$RUNNER_TEMP/permit"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knapsack-final-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permit
          if-no-files-found: warn
          retention-days: 90

  tests:
    needs: gate
    if: contains(github.event.head_commit.message, '[knapsack-final:tests]')
    runs-on: ubuntu-24.04
    # Five allocated minutes plus cleanup/ceil headroom keeps gate+tests within
    # the eight-minute reservation; the frozen grant permits at most six.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Hash-locked environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Authenticate central reservation
        run: python -m studies.knapsack_parameters.final_study.execution download --kind permit --output "$RUNNER_TEMP/permit"
      - name: New checks and unchanged historical regression suites only
        run: python -m studies.knapsack_parameters.final_study.execution tests --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/tests"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knapsack-final-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tests
          if-no-files-found: warn
          retention-days: 90

  probe:
    needs: gate
    if: contains(github.event.head_commit.message, '[knapsack-final:probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        condition:
          - {task: UC-s000, start: cloned}
          - {task: SC-s005, start: bank}
        method: [classical, adaptive_mutation, adaptive_crossover, unbalanced_gap, balanced_gap]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Hash-locked environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Authenticate complete-phase reservation
        run: python -m studies.knapsack_parameters.final_study.execution download --kind permit --output "$RUNNER_TEMP/permit"
      - name: One registered profile - save raw journal before independent replay
        timeout-minutes: 3
        env:
          PROBE_TASK: ${{ matrix.condition.task }}
          PROBE_START: ${{ matrix.condition.start }}
          PROBE_METHOD: ${{ matrix.method }}
        run: python -m studies.knapsack_parameters.final_study.execution worker --task "$PROBE_TASK" --start "$PROBE_START" --method "$PROBE_METHOD" --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/worker"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knapsack-final-worker-${{ matrix.condition.task }}-${{ matrix.condition.start }}-${{ matrix.method }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    needs: [gate, probe]
    if: always() && needs.gate.result == 'success' && contains(github.event.head_commit.message, '[knapsack-final:probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Hash-locked environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Authenticated central permit
        run: python -m studies.knapsack_parameters.final_study.execution download --kind permit --output "$RUNNER_TEMP/permit"
      - name: All available worker evidence - transport errors remain incomplete
        continue-on-error: true
        run: python -m studies.knapsack_parameters.final_study.execution download --kind workers --output "$RUNNER_TEMP/workers"
      - name: Independently replay saved raw journals and retain incomplete cases
        timeout-minutes: 6
        run: python -m studies.knapsack_parameters.final_study.execution aggregate --permit "$RUNNER_TEMP/permit" --artifacts "$RUNNER_TEMP/workers" --output "$RUNNER_TEMP/summary"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knapsack-final-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/summary
          if-no-files-found: warn
          retention-days: 90
