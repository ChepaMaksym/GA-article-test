name: EU26-27 frozen OLD verification

on:
  workflow_dispatch:
  pull_request:
    branches: [research/EU26-07-reset-jump-verification]
    paths:
      - 'candidates/EU26-27/**'
      - '.github/workflows/eu26-27-old-verification.yml'
  push:
    branches: [research/EU26-27-agsemo-old-first]
    paths:
      - 'candidates/EU26-27/**'
      - '.github/workflows/eu26-27-old-verification.yml'

concurrency:
  group: eu26-27-old-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  CSV_ZIP_SHA256: '2d5d3491c23e68bdd6d3c9c9dedfae67c805fa0588a3d443912c0b12c348fe4a'
  CSV_ZIP_URL: 'https://zenodo.org/records/7880836/files/csv.zip?download=1'

jobs:
  cross-platform-smoke:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / workers ${{ matrix.workers }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11', workers: 1}
          - {os: ubuntu-24.04, python: '3.12', workers: 2}
          - {os: ubuntu-24.04, python: '3.13', workers: 4}
          - {os: macos-14, python: '3.11', workers: 4}
          - {os: macos-14, python: '3.12', workers: 1}
          - {os: macos-14, python: '3.13', workers: 2}
          - {os: windows-2022, python: '3.11', workers: 2}
          - {os: windows-2022, python: '3.12', workers: 4}
          - {os: windows-2022, python: '3.13', workers: 1}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned candidate
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'candidates/EU26-27/implementation[test]'
          python -m pip check
      - name: Run complete candidate tests
        shell: bash
        run: |
          cd candidates/EU26-27/implementation
          coverage run -m pytest tests -q
          coverage report -m --fail-under=80
      - name: Produce deterministic smoke profile
        shell: bash
        env:
          WORKERS: ${{ matrix.workers }}
        run: |
          mkdir -p "${RUNNER_TEMP}/eu26-27-smoke"
          python - <<'PY'
          import json, os, platform
          from pathlib import Path
          from eu2627 import campaign_digest, run_campaign
          workers = int(os.environ['WORKERS'])
          rows = run_campaign(range(270001,270007), workers=workers, n=30,
                              offspring=10, max_evaluations=300000)
          payload = {
              'schema': 'eu26-27-smoke-v1',
              'workers': workers,
              'digest': campaign_digest(rows),
              'complete': sum(row.complete for row in rows),
              'python': platform.python_version(),
              'platform': platform.platform(),
          }
          Path(os.environ['RUNNER_TEMP']).joinpath('eu26-27-smoke/profile.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(payload, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: eu26-27-smoke-${{ matrix.os }}-py${{ matrix.python }}-w${{ matrix.workers }}
          path: ${{ runner.temp }}/eu26-27-smoke/profile.json
          if-no-files-found: error
          retention-days: 90

  full-old:
    name: Full OLD / workers ${{ matrix.workers }}
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'candidates/EU26-27/implementation[test]'
          python -m pip check
      - name: Authenticate Zenodo archive
        shell: bash
        run: |
          curl --fail --location --retry 5 "$CSV_ZIP_URL" -o "$RUNNER_TEMP/csv.zip"
          echo "$CSV_ZIP_SHA256  $RUNNER_TEMP/csv.zip" | sha256sum --check --strict
      - name: Run frozen 100-run OLD campaign
        id: campaign
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/eu26-27-old"
          python candidates/EU26-27/implementation/scripts/run_old_verification.py \
            --archive "$RUNNER_TEMP/csv.zip" \
            --workers '${{ matrix.workers }}' \
            --output "$RUNNER_TEMP/eu26-27-old/report.json"
      - name: Write artifact manifest
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'eu26-27-old'
          report = root / 'report.json'
          if not report.is_file():
              raise SystemExit('missing OLD report')
          payload = {
              'report_sha256': hashlib.sha256(report.read_bytes()).hexdigest(),
              'report_bytes': report.stat().st_size,
          }
          (root / 'manifest.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: eu26-27-full-old-w${{ matrix.workers }}
          path: ${{ runner.temp }}/eu26-27-old
          if-no-files-found: error
          retention-days: 90
      - name: Enforce OLD gate
        if: always()
        shell: bash
        run: test '${{ steps.campaign.outcome }}' = success

  binder:
    name: Cross-machine and full-OLD binder
    if: always()
    needs: [cross-platform-smoke, full-old]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: eu26-27-*
          path: artifacts
      - name: Bind every scientific artifact fail-closed
        env:
          SMOKE_RESULT: ${{ needs.cross-platform-smoke.result }}
          OLD_RESULT: ${{ needs.full-old.result }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('artifacts')
          smoke = []
          for path in sorted(root.glob('eu26-27-smoke-*/profile.json')):
              smoke.append(json.loads(path.read_text()))
          if len(smoke) != 9:
              raise SystemExit(f'expected 9 smoke artifacts, got {len(smoke)}')
          smoke_digests = {row['digest'] for row in smoke}
          if len(smoke_digests) != 1:
              raise SystemExit(f'cross-machine smoke digest mismatch: {smoke_digests}')
          reports = []
          for path in sorted(root.glob('eu26-27-full-old-w*/report.json')):
              reports.append(json.loads(path.read_text()))
              manifest = json.loads(path.with_name('manifest.json').read_text())
              observed = hashlib.sha256(path.read_bytes()).hexdigest()
              if observed != manifest['report_sha256']:
                  raise SystemExit('report manifest mismatch')
          if len(reports) != 3:
              raise SystemExit(f'expected 3 full OLD reports, got {len(reports)}')
          if {row['status'] for row in reports} != {'PASS_OLD_DISTRIBUTIONAL_COMPATIBILITY'}:
              raise SystemExit('one or more OLD profiles failed')
          digests = {row['independent']['campaign_digest'] for row in reports}
          raw = {row['raw']['endpoint_digest'] for row in reports}
          if len(digests) != 1 or len(raw) != 1:
              raise SystemExit('full OLD digest mismatch')
          payload = {
              'schema': 'eu26-27-old-binder-v1',
              'status': 'PASS_OLD_BINDER',
              'head': os.environ['GITHUB_SHA'],
              'smoke_digest': next(iter(smoke_digests)),
              'campaign_digest': next(iter(digests)),
              'raw_endpoint_digest': next(iter(raw)),
              'smoke_jobs': len(smoke),
              'full_old_jobs': len(reports),
          }
          Path('binder.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(payload, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: eu26-27-old-binder
          path: binder.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce required upstream jobs
        if: always()
        env:
          SMOKE_RESULT: ${{ needs.cross-platform-smoke.result }}
          OLD_RESULT: ${{ needs.full-old.result }}
        run: |
          test "$SMOKE_RESULT" = success
          test "$OLD_RESULT" = success
