name: Knapsack tournament feedback

on:
  push:
    branches: [research/masters-ga-diversity-crossover]

permissions:
  contents: read
  actions: read

concurrency:
  group: knapsack-tournament-feedback
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.sha }}
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  GITHUB_TOKEN: ${{ github.token }}
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  gate:
    if: contains(github.event.head_commit.message, '[tournament-feedback:')
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      phase: ${{ steps.permit.outputs.phase }}
      worker_timeout: ${{ steps.permit.outputs.worker_timeout }}
      worker_matrix: ${{ steps.permit.outputs.worker_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: permit
        name: Registered phase, immutable code and all-attempt budget
        run: python3 -m studies.knapsack_parameters.tournament_feedback.driver preflight --output "$RUNNER_TEMP/tournament-feedback-permit"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tournament-feedback-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tournament-feedback-permit
          retention-days: 90
          if-no-files-found: warn

  tests:
    needs: gate
    if: needs.gate.outputs.phase == 'tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tournament-feedback-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permit
      - run: python -m studies.knapsack_parameters.tournament_feedback.driver tests --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/tournament-feedback-tests"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tournament-feedback-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tournament-feedback-tests
          retention-days: 90
          if-no-files-found: warn

  prepare:
    needs: gate
    if: needs.gate.outputs.phase == 'prepare-pilot' || needs.gate.outputs.phase == 'prepare-main'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.gate.outputs.worker_timeout) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tournament-feedback-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permit
      - name: Prepare shared banks and audit fresh sources
        env:
          STUDY_STAGE: ${{ needs.gate.outputs.phase == 'prepare-pilot' && 'pilot' || 'main' }}
        run: python -m studies.knapsack_parameters.tournament_feedback.driver prepare --stage "$STUDY_STAGE" --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/tournament-feedback-inputs"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tournament-feedback-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tournament-feedback-inputs
          retention-days: 90
          if-no-files-found: warn

  worker:
    name: ${{ needs.gate.outputs.phase }} (${{ matrix.worker }})
    needs: gate
    if: endsWith(needs.gate.outputs.phase, '-donors') || endsWith(needs.gate.outputs.phase, '-recipients')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.gate.outputs.worker_timeout) }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.gate.outputs.worker_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tournament-feedback-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permit
      - name: Exact physical runs and independent candidate replay
        env:
          STUDY_WORKER: ${{ matrix.worker }}
        run: python -m studies.knapsack_parameters.tournament_feedback.driver worker --worker "$STUDY_WORKER" --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/tournament-feedback-worker"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tournament-feedback-worker-${{ matrix.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tournament-feedback-worker
          retention-days: 90
          if-no-files-found: warn

  summarize:
    needs: [gate, worker]
    if: always() && needs.gate.result == 'success' && (endsWith(needs.gate.outputs.phase, '-donors') || endsWith(needs.gate.outputs.phase, '-recipients'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tournament-feedback-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: tournament-feedback-worker-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workers
          merge-multiple: false
      - name: Complete source rectangle, checksums, schedules or statistics
        run: python -m studies.knapsack_parameters.tournament_feedback.driver aggregate --workers "$RUNNER_TEMP/workers" --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/tournament-feedback-summary"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tournament-feedback-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tournament-feedback-summary
          retention-days: 90
          if-no-files-found: warn

  final:
    needs: gate
    if: needs.gate.outputs.phase == 'aggregate'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tournament-feedback-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permit
      - run: python -m studies.knapsack_parameters.tournament_feedback.driver final --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/tournament-feedback-final"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tournament-feedback-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tournament-feedback-final
          retention-days: 90
          if-no-files-found: warn
