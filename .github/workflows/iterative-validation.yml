name: Iterative validation first analysis

on:
  workflow_dispatch:
    inputs:
      authorization_id:
        description: Exact identity of the fresh first-analysis resource grant
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: knapsack-iterative-validation
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  MPLBACKEND: Agg
  MODULE: studies.knapsack_parameters.iterative_validation
  LOCK: studies/knapsack_parameters/ga_study/dependencies/requirements.lock

jobs:
  first-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Admit the fresh grant before tests or calculations
        id: admission
        env:
          REQUESTED_AUTHORIZATION_ID: ${{ inputs.authorization_id }}
        shell: bash
        run: |
          python3 -m "$MODULE.admission" --authorization-id "$REQUESTED_AUTHORIZATION_ID" --output stage/meta/admission.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install the frozen analysis dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r "$LOCK"
      - name: Check synthetic threshold, pairing and admission cases
        shell: bash
        run: |
          mkdir -p stage/meta
          set -o pipefail
          python -m unittest "$MODULE.test_analysis" -v 2>&1 | tee stage/meta/tests.txt
      - name: Analyze the authenticated retained records
        env:
          EXPECTED_SOURCE_SHA256: ${{ steps.admission.outputs.source_sha256 }}
        shell: bash
        run: |
          python -m "$MODULE.analysis" --source studies/knapsack_parameters/iterative_validation/data/validated_records.json.gz --expected-sha256 "$EXPECTED_SOURCE_SHA256" --output stage/analysis
      - name: Preserve the execution status and upload budget proof
        id: artifact-budget
        if: always()
        env:
          EXECUTION_STATUS: ${{ job.status }}
        shell: bash
        run: |
          mkdir -p stage/meta
          python3 -c 'import json,os,pathlib; pathlib.Path("stage/meta/execution-status.json").write_text(json.dumps({"job_status":os.environ["EXECUTION_STATUS"],"workflow_run_id":os.environ["GITHUB_RUN_ID"],"workflow_commit":os.environ["GITHUB_SHA"],"new_search_evaluations":0},indent=2)+"\n",encoding="utf-8")'
          python3 -m "$MODULE.admission" --validate-artifacts stage
      - name: Retain complete or partial first-stage analysis evidence
        if: always() && steps.artifact-budget.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iterative-validation-first-analysis-${{ github.run_id }}
          path: stage/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
