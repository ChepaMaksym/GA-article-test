name: Knapsack mutation and population secondary review

on:
  push:
    branches: [research/masters-ga-diversity-crossover]

permissions:
  contents: read
  actions: read

concurrency:
  group: knapsack-mutation-population-review
  cancel-in-progress: false

env:
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  GITHUB_TOKEN: ${{ github.token }}
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  gate:
    if: contains(github.event.head_commit.message, '[mutation-population:')
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Separate bounded secondary-review authority
        run: python3 -m studies.knapsack_parameters.mutation_population_review.driver preflight --output "$RUNNER_TEMP/review-permit"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-population-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-permit
          retention-days: 90
          if-no-files-found: warn

  review:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mutation-population-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-permit
      - name: CI fixtures, saved-journal replay and six descriptive figures
        run: python -m studies.knapsack_parameters.mutation_population_review.driver review --permit "$RUNNER_TEMP/review-permit" --output "$RUNNER_TEMP/mutation-population-review"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-population-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-population-review
          retention-days: 90
          if-no-files-found: warn
