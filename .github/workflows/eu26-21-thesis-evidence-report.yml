name: EU26-21 descriptive thesis evidence report

on:
  push:
    branches: [research/EU26-21-chcqx-census-old-first]
    paths: ['.github/workflows/eu26-21-thesis-evidence-report.yml']
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reporting implementation and workflow SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: eu26-21-thesis-evidence-report-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  report:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: ${{ github.workspace }}/candidates/EU26-21
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      THESIS_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Bind dispatch and actual workflow revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$THESIS_WORKFLOW_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Bind checked-out reporting implementation
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install frozen environment and run synthetic reporting tests
        run: |
          python -m pip install -r candidates/EU26-21/corrected_applied/requirements.txt
          python -m pip check
          python -m unittest candidates/EU26-21/tests/test_thesis_tables.py -v
      - name: Fetch only the 30 fixed campaign artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m common_bridge.fetch_source_artifacts
          --repository "$GITHUB_REPOSITORY"
          --source-run-id 34233477859
          --artifact-ledger candidates/EU26-21/common_bridge/evidence/source-artifact-ledger.json
          --output-dir "${RUNNER_TEMP}/thesis-source"
          --metadata-output "${RUNNER_TEMP}/thesis-verified-source.json"
      - name: Produce descriptive tables and plots without new scientific gates
        run: >-
          python -m evidence_audit.thesis_tables
          --rows-dir "${RUNNER_TEMP}/thesis-source"
          --expected-ledger candidates/EU26-21/common_bridge/evidence/source-artifact-ledger.json
          --verified-ledger "${RUNNER_TEMP}/thesis-verified-source.json"
          --output-dir "${RUNNER_TEMP}/thesis-report"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: eu26-21-thesis-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/thesis-report
            ${{ runner.temp }}/thesis-verified-source.json
            candidates/EU26-21/common_bridge/evidence/source-artifact-ledger.json
            candidates/EU26-21/common_bridge/evidence/campaign-report.json
            candidates/EU26-21/common_bridge/evidence/reaggregated-report.json
          if-no-files-found: error
          retention-days: 90
