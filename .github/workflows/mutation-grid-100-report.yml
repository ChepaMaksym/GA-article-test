name: Mutation tuning - report figures only

on:
  workflow_dispatch:
  push:
    branches: [research/mutation-grid100-report-20261111]
    paths: [.github/workflows/mutation-grid-100-report.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: mutation-grid100-report-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MPLBACKEND: Agg

jobs:
  figures:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Render approved mutation report figures once' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mutation-grid100-tuning-results-42994492163
          run-id: 42994492163
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs
      - name: Render corrected figures from existing aggregates
        run: |
          python -m studies.knapsack_parameters.mutation_grid_100_report.render --inputs "$RUNNER_TEMP/inputs" --out "$RUNNER_TEMP/output"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-grid100-report-${{ github.run_id }}
          path: ${{ runner.temp }}/output
          retention-days: 90
          if-no-files-found: error
