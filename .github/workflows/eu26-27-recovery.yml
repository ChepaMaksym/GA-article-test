name: EU26-27 RESEARCH_2 recovery

on:
  workflow_dispatch:
  push:
    branches: [research/EU26-27-agsemo-recovery]
    paths:
      - 'candidates/EU26-27/**'
      - '.github/workflows/eu26-27-recovery.yml'
  pull_request:
    branches: [research/EU26-07-reset-jump-verification]
    paths:
      - 'candidates/EU26-27/**'
      - '.github/workflows/eu26-27-recovery.yml'

concurrency:
  group: eu26-27-recovery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  CSV_ZIP_SHA256: '2d5d3491c23e68bdd6d3c9c9dedfae67c805fa0588a3d443912c0b12c348fe4a'
  CSV_ZIP_URL: 'https://zenodo.org/records/7880836/files/csv.zip?download=1'

jobs:
  unit:
    name: Unit ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11'}
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.13'}
          - {os: macos-14, python: '3.12'}
          - {os: windows-2022, python: '3.12'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install frozen candidate
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'candidates/EU26-27/implementation[test]'
          python -m pip check
      - name: Run complete tests under coverage
        shell: bash
        run: |
          cd candidates/EU26-27/implementation
          coverage run -m pytest tests -q
          coverage report -m --fail-under=80

  worker-smoke:
    name: Smoke ${{ matrix.os }} / workers ${{ matrix.workers }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        workers: [1, 2, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen candidate
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'candidates/EU26-27/implementation[test]'
          python -m pip check
      - name: Run importable spawn-safe recovery smoke
        shell: bash
        env:
          WORKERS: ${{ matrix.workers }}
        run: |
          mkdir -p "$RUNNER_TEMP/eu26-27-smoke"
          python candidates/EU26-27/implementation/scripts/smoke_recovery.py --workers "$WORKERS" --tie-policy uniform --split-policy balanced --output "$RUNNER_TEMP/eu26-27-smoke/R1.json"
          python candidates/EU26-27/implementation/scripts/smoke_recovery.py --workers "$WORKERS" --tie-policy first --split-policy balanced --output "$RUNNER_TEMP/eu26-27-smoke/R2.json"
          python candidates/EU26-27/implementation/scripts/smoke_recovery.py --workers "$WORKERS" --tie-policy uniform --split-policy literal_one_based --output "$RUNNER_TEMP/eu26-27-smoke/R3.json"
          python candidates/EU26-27/implementation/scripts/smoke_recovery.py --workers "$WORKERS" --tie-policy first --split-policy literal_one_based --output "$RUNNER_TEMP/eu26-27-smoke/R4.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-smoke-${{ matrix.os }}-w${{ matrix.workers }}
          path: ${{ runner.temp }}/eu26-27-smoke
          if-no-files-found: error
          retention-days: 90

  raw-auth:
    name: Authenticate retained Zenodo raw profile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download and authenticate csv.zip
        shell: bash
        run: |
          curl --fail --location --retry 5 "$CSV_ZIP_URL" -o "$RUNNER_TEMP/csv.zip"
          echo "$CSV_ZIP_SHA256  $RUNNER_TEMP/csv.zip" | sha256sum --check --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eu26-27-authenticated-csv
          path: ${{ runner.temp }}/csv.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  full-recovery:
    name: Full 2x2 recovery / workers ${{ matrix.workers }}
    needs: raw-auth
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'candidates/EU26-27/implementation[test]'
          python -m pip check
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: eu26-27-authenticated-csv
          path: ${{ runner.temp }}/raw
      - name: Verify downloaded evidence again
        shell: bash
        run: |
          echo "$CSV_ZIP_SHA256  $RUNNER_TEMP/raw/csv.zip" | sha256sum --check --strict
      - name: Run frozen 100-seed 2x2 recovery matrix
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/recovery"
          python candidates/EU26-27/implementation/scripts/run_recovery_matrix.py \
            --archive "$RUNNER_TEMP/raw/csv.zip" \
            --workers '${{ matrix.workers }}' \
            --output "$RUNNER_TEMP/recovery/report.json"
      - name: Bind report to bytes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP']) / 'recovery' / 'report.json'
          if not report.is_file():
              raise SystemExit('missing recovery report')
          payload = {
              'schema': 'eu26-27-recovery-report-manifest-v1',
              'report_sha256': hashlib.sha256(report.read_bytes()).hexdigest(),
              'report_bytes': report.stat().st_size,
          }
          report.with_name('manifest.json').write_text(json.dumps(payload, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-full-w${{ matrix.workers }}
          path: ${{ runner.temp }}/recovery
          if-no-files-found: error
          retention-days: 90

  binder:
    name: Recovery scientific binder and graphs
    if: always()
    needs: [unit, worker-smoke, raw-auth, full-recovery]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install candidate for graph tooling
        run: python -m pip install -e 'candidates/EU26-27/implementation'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: recovery-*
          path: artifacts
      - name: Bind cross-OS workers and full reports
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          SMOKE_RESULT: ${{ needs.worker-smoke.result }}
          RAW_RESULT: ${{ needs.raw-auth.result }}
          FULL_RESULT: ${{ needs.full-recovery.result }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from collections import defaultdict
          from pathlib import Path
          root = Path('artifacts')
          expected_upstream = {
              'unit': os.environ['UNIT_RESULT'],
              'smoke': os.environ['SMOKE_RESULT'],
              'raw': os.environ['RAW_RESULT'],
              'full': os.environ['FULL_RESULT'],
          }
          if any(value != 'success' for value in expected_upstream.values()):
              raise SystemExit(f'upstream CI failure: {expected_upstream}')

          smoke_files = sorted(root.glob('recovery-smoke-*/*.json'))
          if len(smoke_files) != 36:
              raise SystemExit(f'expected 36 smoke JSON files, got {len(smoke_files)}')
          grouped = defaultdict(set)
          for path in smoke_files:
              row = json.loads(path.read_text(encoding='utf-8'))
              key = (row['tie_policy'], row['split_policy'])
              grouped[key].add(row['digest'])
              if row['complete'] != 6:
                  raise SystemExit(f'incomplete smoke profile: {path}')
          if len(grouped) != 4 or any(len(values) != 1 for values in grouped.values()):
              raise SystemExit(f'cross-machine/worker digest mismatch: {dict(grouped)}')

          report_paths = sorted(root.glob('recovery-full-w*/report.json'))
          if len(report_paths) != 3:
              raise SystemExit(f'expected 3 full reports, got {len(report_paths)}')
          reports = []
          for path in report_paths:
              manifest = json.loads(path.with_name('manifest.json').read_text(encoding='utf-8'))
              observed = hashlib.sha256(path.read_bytes()).hexdigest()
              if observed != manifest['report_sha256']:
                  raise SystemExit(f'manifest mismatch: {path}')
              reports.append(json.loads(path.read_text(encoding='utf-8')))
          if {row['raw']['endpoint_digest'] for row in reports}.__len__() != 1:
              raise SystemExit('raw endpoint digest mismatch')
          names = set(reports[0]['variants'])
          if names != {'R1_uniform_balanced','R2_first_balanced','R3_uniform_literal','R4_first_literal'}:
              raise SystemExit('variant set drift')
          for name in names:
              digests = {row['variants'][name]['campaign_digest'] for row in reports}
              if len(digests) != 1:
                  raise SystemExit(f'full worker digest mismatch for {name}: {digests}')
          decisions = {row['scientific_decision'] for row in reports}
          if len(decisions) != 1:
              raise SystemExit(f'scientific decision drift: {decisions}')
          canonical = next(row for row in reports if row['workers'] == 1)
          Path('canonical_report.json').write_text(json.dumps(canonical, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          binder = {
              'schema': 'eu26-27-recovery-binder-v1',
              'research_tag': 'RESEARCH_2',
              'head': os.environ['GITHUB_SHA'],
              'ci_status': 'PASS_RECOVERY_INFRASTRUCTURE',
              'scientific_decision': canonical['scientific_decision'],
              'diagnostic_matches': canonical['diagnostic_matches'],
              'hybrid': canonical['hybrid'],
              'smoke_profiles': len(smoke_files),
              'full_reports': len(reports),
              'worker_digests_equal': True,
              'cross_machine_smoke_equal': True,
          }
          Path('binder.json').write_text(json.dumps(binder, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          print(json.dumps(binder, sort_keys=True))
          PY
      - name: Generate evidence-only SVG graphs
        run: |
          mkdir -p figures
          python candidates/EU26-27/implementation/scripts/plot_recovery.py --report canonical_report.json --out-dir figures --commit "$GITHUB_SHA"
      - name: Write job summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open('canonical_report.json',encoding='utf-8'))
          b=json.load(open('binder.json',encoding='utf-8'))
          print('# EU26-27 RESEARCH_2 recovery')
          print()
          print(f"- CI infrastructure: `{b['ci_status']}`")
          print(f"- scientific decision: `{b['scientific_decision']}`")
          print(f"- diagnostic matches: `{b['diagnostic_matches']}`")
          print(f"- HYBRID: `{b['hybrid']}`")
          print()
          print('| Variant | Median FE | Ratio | 95% ratio CI | K distance | Match |')
          print('|---|---:|---:|---|---:|---|')
          for name,v in r['variants'].items():
              c=v['compatibility']; s=v['endpoint_summary']
              print(f"| {name} | {s['median']:.1f} | {c['median_ratio']:.3f} | [{c['median_ratio_ci95'][0]:.3f}, {c['median_ratio_ci95'][1]:.3f}] | {c['kolmogorov_distance']:.3f} | {v['diagnostic_match']} |")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-binder-and-graphs
          path: |
            binder.json
            canonical_report.json
            figures
          if-no-files-found: error
          retention-days: 90
