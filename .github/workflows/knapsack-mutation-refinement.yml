name: Knapsack mutation refinement

on:
  push:
    branches: [research/masters-ga-diversity-crossover]

permissions:
  contents: read
  actions: read

concurrency:
  group: knapsack-mutation-refinement
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.sha }}
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  GITHUB_TOKEN: ${{ github.token }}
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MPLBACKEND: Agg

jobs:
  gate:
    if: contains(github.event.head_commit.message, '[mutation-refinement:')
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      phase: ${{ steps.permit.outputs.phase }}
      worker_matrix: ${{ steps.permit.outputs.worker_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: permit
        name: Exact source, cumulative budget and separate resource grant
        run: python3 -m studies.knapsack_parameters.mutation_refinement.driver preflight --output "$RUNNER_TEMP/mutation-refinement-permit"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-refinement-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-refinement-permit
          retention-days: 90
          if-no-files-found: warn

  tests:
    needs: gate
    if: needs.gate.outputs.phase == 'tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Hash-locked existing binary dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mutation-refinement-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permit
      - name: Software fixtures only
        run: python -m studies.knapsack_parameters.mutation_refinement.driver tests --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/mutation-refinement-tests"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-refinement-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-refinement-tests
          retention-days: 90
          if-no-files-found: warn

  prepare:
    needs: gate
    if: needs.gate.outputs.phase == 'prepare-pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mutation-refinement-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permit
      - name: Eight shared initial banks, no new search or exact solve
        run: python -m studies.knapsack_parameters.mutation_refinement.driver prepare --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/mutation-refinement-inputs"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-refinement-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-refinement-inputs
          retention-days: 90
          if-no-files-found: warn

  worker:
    name: pilot (${{ matrix.worker }})
    needs: gate
    if: needs.gate.outputs.phase == 'pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.gate.outputs.worker_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mutation-refinement-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permit
      - name: Ten registered runs with independent journal replay
        env:
          STUDY_WORKER: ${{ matrix.worker }}
        run: python -m studies.knapsack_parameters.mutation_refinement.driver worker --worker "$STUDY_WORKER" --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/mutation-refinement-worker"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-refinement-worker-${{ matrix.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-refinement-worker
          retention-days: 90
          if-no-files-found: warn

  aggregate:
    needs: [gate, worker]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.phase == 'pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mutation-refinement-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mutation-refinement-worker-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workers
          merge-multiple: false
      - name: Exact forty-run completeness, costs and forecast only
        run: python -m studies.knapsack_parameters.mutation_refinement.driver aggregate --workers "$RUNNER_TEMP/workers" --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/mutation-refinement-summary"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-refinement-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-refinement-summary
          retention-days: 90
          if-no-files-found: warn
