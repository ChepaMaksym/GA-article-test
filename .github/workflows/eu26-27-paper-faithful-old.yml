name: EU26-27 paper-faithful OLD

on:
  workflow_dispatch:
  pull_request:
    branches:
      - research/EU26-07-reset-jump-verification
    paths:
      - 'candidates/EU26-27/source_native/compare_paper_faithful_old.py'
      - 'candidates/EU26-27/source_native/test_compare_paper_faithful_old.py'
      - '.github/workflows/eu26-27-paper-faithful-old.yml'
  push:
    branches:
      - research/EU26-27-agsemo-recovery
    paths:
      - 'candidates/EU26-27/source_native/compare_paper_faithful_old.py'
      - 'candidates/EU26-27/source_native/test_compare_paper_faithful_old.py'
      - '.github/workflows/eu26-27-paper-faithful-old.yml'

concurrency:
  group: eu26-27-paper-faithful-old-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GSEMO_SHA: fbe1d3ed3064dedd85ba3c5eaf78fe4ea3d6b380
  IOH_SHA: f223c682dff0749067d00b870f83ad754f7d96f5
  SAFETY_CAP_FE: '10000000'

jobs:
  comparator-tests:
    name: Paper-faithful comparator tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run synthetic fail-closed tests
        run: |
          set -euo pipefail
          python candidates/EU26-27/source_native/test_compare_paper_faithful_old.py

  replay:
    name: 100-run completion OLD vs Zenodo
    needs: comparator-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Checkout exact frozen author source and paper-era IOH
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          mkdir -p upstream
          git clone --filter=blob:none https://github.com/FurongYe/GSEMO.git upstream/GSEMO
          git -C upstream/GSEMO checkout --detach "$GSEMO_SHA"
          git clone --filter=blob:none https://github.com/IOHprofiler/IOHexperimenter.git upstream/IOHexperimenter
          git -C upstream/IOHexperimenter checkout --detach "$IOH_SHA"
          git -C upstream/IOHexperimenter submodule sync --recursive
          git -C upstream/IOHexperimenter submodule update --init --recursive
          test "$(git -C upstream/GSEMO rev-parse HEAD)" = "$GSEMO_SHA"
          test "$(git -C upstream/IOHexperimenter rev-parse HEAD)" = "$IOH_SHA"
          test "$(cat upstream/IOHexperimenter/VERSION)" = "0.3.9"
          test "$(git -C upstream/GSEMO hash-object src/gsemo.hpp)" = "2693144bcfccff902343a02c6c8e48d7dd263257"
          test "$(git -C upstream/GSEMO hash-object src/main.cpp)" = "22025e4680da85c98e3bb5ea30db8334ca25dff3"
          test "$(git -C upstream/GSEMO hash-object src/problems.cpp)" = "cd9b520253e3b0b0390e35bf4fb86d4249c204de"

      - name: Rehydrate historical dependency paths without changing algorithm source
        run: |
          set -euo pipefail
          test "$(git -C upstream/GSEMO show HEAD:include)" = "/home/jacob/code/IOHexperimenter/include/"
          test "$(git -C upstream/GSEMO show HEAD:external)" = "/home/jacob/code/IOHexperimenter/external/"
          rm upstream/GSEMO/include upstream/GSEMO/external
          cp -R upstream/IOHexperimenter/include upstream/GSEMO/include
          cp -R upstream/IOHexperimenter/external upstream/GSEMO/external

      - name: Build exact author OLD
        run: |
          set -euo pipefail
          cmake -S upstream/GSEMO -B upstream/GSEMO/build -DCMAKE_BUILD_TYPE=Release
          cmake --build upstream/GSEMO/build --config Release --parallel 2
          BIN="$(find upstream/GSEMO/build -type f -name gsemo | head -n 1)"
          test -n "$BIN"
          echo "AUTHOR_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Record runtime identity
        run: |
          set -euo pipefail
          mkdir -p evidence/paper-faithful-old
          {
            c++ --version || true
            cmake --version || true
            uname -a || true
          } > evidence/paper-faithful-old/runtime.txt

      - name: Run 100 sequential author OLD runs to Pareto completion
        run: |
          set -euo pipefail
          mkdir source-paper-run
          cd source-paper-run
          "$GITHUB_WORKSPACE/$AUTHOR_BIN" 1 100 TwoRate 10 1 1 "$SAFETY_CAP_FE" 100 > stdout.txt
          test -n "$(find . -name '*.json' -type f | head -n 1)"

      - name: Compare raw first-hit trajectory and endpoints with Zenodo
        run: |
          set -euo pipefail
          python candidates/EU26-27/source_native/compare_paper_faithful_old.py \
            --author-output-root source-paper-run \
            --output-dir evidence/paper-faithful-old \
            --gsemo-sha "$GSEMO_SHA" \
            --ioh-sha "$IOH_SHA" \
            --safety-cap-fe "$SAFETY_CAP_FE"

      - name: Publish result
        if: always()
        run: |
          test -f evidence/paper-faithful-old/summary.md
          cat evidence/paper-faithful-old/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: eu26-27-paper-faithful-old-evidence
          path: |
            evidence/paper-faithful-old/report.json
            evidence/paper-faithful-old/summary.md
            evidence/paper-faithful-old/runtime.txt
            source-paper-run/stdout.txt
            source-paper-run/**/*.json
            source-paper-run/**/*.dat
          if-no-files-found: error
          retention-days: 90
