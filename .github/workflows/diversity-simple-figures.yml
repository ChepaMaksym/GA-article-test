name: Simple GA question-led figures

on:
  push:
    branches: [research/masters-ga-diversity-crossover]

permissions:
  contents: read
  actions: read

concurrency:
  group: diversity-simple-question-figures
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.sha }}
  STUDY_WORKFLOW_SHA: ${{ github.sha }}
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  simple_figures:
    if: contains(github.event.head_commit.message, '[diversity-simple:render]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source and cumulative resource preflight
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m studies.diversity_crossover.simple_figures.build preflight --output "$RUNNER_TEMP/simple-figures"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install the unchanged hash-locked environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Independent checks, then explanatory rendering only
        run: python -m studies.diversity_crossover.simple_figures.build render --output "$RUNNER_TEMP/simple-figures"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: simple-ga-figures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simple-figures
          if-no-files-found: warn
          retention-days: 90
