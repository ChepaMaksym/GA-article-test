name: Tournament feedback review (descriptive)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tournament-feedback-review
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/research/masters-ga-diversity-crossover'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Account previous allocated jobs before work
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/tournament-feedback-review.yml/runs?per_page=100" --jq '.workflow_runs[] | [.id,.run_attempt] | @tsv' > "$RUNNER_TEMP/review-runs.tsv"
          : > "$RUNNER_TEMP/review-jobs.jsonl"
          while IFS=$'\t' read -r run attempt; do
            [ "$run" = "$GITHUB_RUN_ID" ] && continue
            for a in $(seq 1 "$attempt"); do
              gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/attempts/$a/jobs?per_page=100" --jq '.jobs[] | {started_at,completed_at,runner_name}' >> "$RUNNER_TEMP/review-jobs.jsonl"
            done
          done < "$RUNNER_TEMP/review-runs.tsv"
          python3 -c 'import json,datetime,math,sys; rows=[json.loads(x) for x in open(sys.argv[1])]; assert all(not r["runner_name"] or (r["started_at"] and r["completed_at"]) for r in rows), "unknown previous usage"; used=sum(max(1,math.ceil((datetime.datetime.fromisoformat(r["completed_at"].replace("Z","+00:00"))-datetime.datetime.fromisoformat(r["started_at"].replace("Z","+00:00"))).total_seconds()/60)) for r in rows if r["runner_name"]); print("previous runner minutes:",used,"reserved current job: 20; ceiling: 30"); assert used+20<=30, "insufficient budget"' "$RUNNER_TEMP/review-jobs.jsonl"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes --only-binary=:all: -r studies/knapsack_parameters/tournament_feedback_review/requirements.lock
      - name: Unit tests
        run: python -m unittest studies.knapsack_parameters.tournament_feedback_review.test_review
      - name: Fetch frozen source and two canonical smoke archives
        run: |
          mkdir -p "$RUNNER_TEMP/review-source" "$RUNNER_TEMP/review-bundle" "$RUNNER_TEMP/review-output"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12879381392/zip" > "$RUNNER_TEMP/source.zip"
          echo '42c5d3676a37f49adcebf6db7af565b54f31604d61e5ef8687d85c2287f3a422  '"$RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/review-source"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12876589015/zip" > "$RUNNER_TEMP/review-bundle/donor.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12878805428/zip" > "$RUNNER_TEMP/review-bundle/recipients.zip"
      - name: Descriptive analysis and portable smoke audit
        run: |
          python -m studies.knapsack_parameters.tournament_feedback_review.descriptive --source "$RUNNER_TEMP/review-source" --output "$RUNNER_TEMP/review-output"
          python -m studies.knapsack_parameters.tournament_feedback_review audit --bundle "$RUNNER_TEMP/review-bundle" --scope smoke --output "$RUNNER_TEMP/review-output"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tournament-feedback-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-output
          retention-days: 90
          if-no-files-found: warn
