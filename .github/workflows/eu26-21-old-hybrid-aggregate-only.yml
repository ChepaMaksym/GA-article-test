name: EU26-21 replay immutable thirty-seed artifacts (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '31934321927'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  replay-existing:
    name: Strictly revalidate immutable 30-seed artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - name: Install frozen analysis environment
        run: python -m pip install -r candidates/EU26-21/hybrid_1/requirements.txt
      - name: Run canonical guard, protocol, and negative tests
        run: >-
          python -m unittest
          candidates/EU26-21/tests/test_hybrid_1_aggregation_guard.py
          candidates/EU26-21/tests/test_hybrid_1_audit_validation.py
          candidates/EU26-21/tests/test_hybrid_1_paired_comparison_v2.py
          -v
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: eu26-21-old-hybrid-v2-seed-*
          path: ${{ runner.temp }}/paired-rows
          merge-multiple: true
      - name: Recompute strict report without rerunning optimizers
        run: |
          set -o pipefail
          python candidates/EU26-21/hybrid_1/aggregate_old_hybrid_v2.py \
            "${RUNNER_TEMP}/paired-rows" \
            --output-json "${RUNNER_TEMP}/eu26-21-old-hybrid-30-v2-audited.json" \
            --enforce-protocol \
            2>&1 | tee "${RUNNER_TEMP}/immutable-replay.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: eu26-21-old-vs-hybrid-1-immutable-audit
          path: |
            ${{ runner.temp }}/eu26-21-old-hybrid-30-v2-audited.json
            ${{ runner.temp }}/immutable-replay.log
            ${{ runner.temp }}/paired-rows
          if-no-files-found: warn
          retention-days: 90
