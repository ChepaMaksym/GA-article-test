name: Knapsack crossover grid continuation

on:
  push:
    branches: [research/crossover-ci-handoff-20261109]

permissions:
  contents: read

concurrency:
  group: knapsack-crossover-ci-handoff-20261109
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MPLBACKEND: Agg

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Verify handoff and exact CI compatibility
        run: |
          python -m unittest studies.knapsack_parameters.crossover_population_refinement_ci.test_ci -v
          python -m studies.knapsack_parameters.crossover_population_refinement_ci.ci_driver pilot --out "$RUNNER_TEMP/crossover-pilot"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crossover-pilot-${{ github.run_id }}
          path: ${{ runner.temp }}/crossover-pilot
          retention-days: 30
          if-no-files-found: warn

  shard:
    needs: pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: crossover-pilot-${{ github.run_id }}
          path: ${{ runner.temp }}/pilot
      - name: Run only registered missing configurations
        run: python -m studies.knapsack_parameters.crossover_population_refinement_ci.ci_driver shard --index '${{ matrix.shard }}' --pilot "$RUNNER_TEMP/pilot/pilot.json" --out "$RUNNER_TEMP/shard-${{ matrix.shard }}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crossover-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn

  analysis:
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: crossover-shard-0-${{ github.run_id }}
          path: ${{ runner.temp }}/all/shard-0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: crossover-shard-1-${{ github.run_id }}
          path: ${{ runner.temp }}/all/shard-1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: crossover-shard-2-${{ github.run_id }}
          path: ${{ runner.temp }}/all/shard-2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: crossover-shard-3-${{ github.run_id }}
          path: ${{ runner.temp }}/all/shard-3
      - name: Verify the complete grid and make figures
        run: python -m studies.knapsack_parameters.crossover_population_refinement_ci.ci_driver aggregate --shards "$RUNNER_TEMP/all" --out "$RUNNER_TEMP/crossover-analysis"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crossover-analysis-${{ github.run_id }}
          path: ${{ runner.temp }}/crossover-analysis
          retention-days: 30
          if-no-files-found: warn
