name: Paired adaptive threshold screening (3780 cases)
on:
  push:
    branches: [research/adaptive-threshold-validation]
    paths: [studies/knapsack_parameters/adaptive_threshold_validation/screen-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: adaptive-threshold-screening
  cancel-in-progress: true
env:
  STUDY: studies.knapsack_parameters.adaptive_threshold_validation
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  register:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check pilot revision, registered counts and enumerate paired blocks
        id: plan
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json, os
          pkg=Path('studies/knapsack_parameters/adaptive_threshold_validation')
          req=json.loads((pkg/'screen-request.json').read_bytes())
          for name,expected in req['frozen_files'].items():
              if sha256((pkg/name).read_bytes()).hexdigest()!=expected:
                  raise ValueError('Changed frozen source: '+name)
          data=json.loads((pkg/'registered.json').read_bytes())
          if data['count']!=3780 or len(data['stage_a'])!=42 or len(data['comparisons'])!=20:
              raise ValueError('Wrong registration')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              print('shards='+json.dumps(list(range(180))),file=out)
          PY
  screen:
    needs: register
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.register.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install the pinned numerical runtime
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: github.run_attempt != '1'
        with:
          pattern: screen-raw-${{ matrix.shard }}-attempt-*
          path: restored
      - name: Restore raw receipts from the first screening
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45898934536
          pattern: screen-raw-${{ matrix.shard }}-attempt-*
          path: restored/prior
      - name: Run and replay the 21 configurations from one paired start
        run: python -m "$STUDY.screen" run --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: screen-raw-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: evidence/
          compression-level: 0
          if-no-files-found: warn
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: screen-compact-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: compact/
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    needs: screen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: screen-compact-*
          path: collected
      - run: python -m "$STUDY.screen" summarize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: screening-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: report/
          if-no-files-found: error
          retention-days: 90
