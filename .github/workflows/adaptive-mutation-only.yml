name: Own mutation-only adaptive GA

on:
  push:
    branches: [research/masters-ga-diversity-crossover]

permissions:
  contents: read
  actions: read

concurrency:
  group: adaptive-mutation-only
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.sha }}
  GITHUB_TOKEN: ${{ github.token }}
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  tests:
    if: contains(github.event.head_commit.message, '[adaptive-mutation:tests]')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact authority and cumulative resource check
        run: python3 -m studies.adaptive_parameters.mutation_only.driver preflight --output "$RUNNER_TEMP/mutation-only"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Hash-locked environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Independent tests only; no scientific pilot
        run: python -m studies.adaptive_parameters.mutation_only.driver tests --output "$RUNNER_TEMP/mutation-only"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adaptive-mutation-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-only
          if-no-files-found: warn
          retention-days: 90
  prepare:
    if: contains(github.event.head_commit.message, '[adaptive-mutation:prepare]')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Separate user approval, exact authority and resource check
        run: python3 -m studies.adaptive_parameters.mutation_only.driver preflight --output "$RUNNER_TEMP/mutation-only"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Hash-locked environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Prepare eight beginnings; no search
        run: python -m studies.adaptive_parameters.mutation_only.driver prepare --output "$RUNNER_TEMP/mutation-only"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adaptive-mutation-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-only
          if-no-files-found: warn
          retention-days: 90
  pilot:
    if: contains(github.event.head_commit.message, '[adaptive-mutation:pilot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Separate user approval, exact authority and resource check
        run: python3 -m studies.adaptive_parameters.mutation_only.driver preflight --output "$RUNNER_TEMP/mutation-only"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Hash-locked environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: One technical seed; sixteen runs and independent replay
        run: python -m studies.adaptive_parameters.mutation_only.driver pilot --output "$RUNNER_TEMP/mutation-only"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adaptive-mutation-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-only
          if-no-files-found: warn
          retention-days: 90
