name: Knapsack mutation grid 100 - registered tuning

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: mutation-grid100-tuning-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MPLBACKEND: Agg

# Maximum: 10 + 225*8 + 15 = 1825 runner-minutes, excluding minute rounding.
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.grid.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Verify distinct tuning authorization and prospective tests
        run: |
          python -c "from studies.knapsack_parameters.mutation_grid_100.common import guard_stage; guard_stage('tuning')"
          python -m unittest discover -s studies/knapsack_parameters/mutation_grid_100/tests -t . -v
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mutation-grid100-inputs-42988256361
          run-id: 42988256361
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/technical
      - name: Authenticate retained inputs and register 1350 missing identities
        id: grid
        run: |
          python -m studies.knapsack_parameters.mutation_grid_100.prepare_tuning --inputs "$RUNNER_TEMP/technical" --out "$RUNNER_TEMP/inputs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-grid100-tuning-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/inputs
          retention-days: 30
          if-no-files-found: error

  search:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mutation-grid100-tuning-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/inputs
      - name: Execute and independently replay six registered cases
        run: |
          python -m studies.knapsack_parameters.mutation_grid_100.run_tuning --inputs "$RUNNER_TEMP/inputs" --shard '${{ matrix.shard }}' --raw "$RUNNER_TEMP/raw" --compact "$RUNNER_TEMP/compact"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mutation-grid100-tuning-raw-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ runner.temp }}/raw
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mutation-grid100-tuning-compact-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ runner.temp }}/compact
          retention-days: 30
          if-no-files-found: warn

  analysis:
    needs: search
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mutation-grid100-tuning-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mutation-grid100-tuning-compact-*-${{ github.run_id }}
          path: ${{ runner.temp }}/blocks
      - name: Admit 2790 records and freeze both selections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m studies.knapsack_parameters.mutation_grid_100.admit_tuning --inputs "$RUNNER_TEMP/inputs" --blocks "$RUNNER_TEMP/blocks" --out "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-grid100-tuning-results-${{ github.run_id }}
          path: ${{ runner.temp }}/results
          retention-days: 30
          if-no-files-found: error
