name: Knapsack 100-item population validation - technical stage

on:
  workflow_dispatch:
  push:
    branches:
      - research/population100-validation-20261110
    paths:
      - studies/knapsack_parameters/population_validation_100/**
      - .github/workflows/population-validation-100.yml

permissions:
  contents: read

concurrency:
  group: population-validation-100-technical-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MPLBACKEND: Agg

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install frozen dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Check separate resource authority and source seal
        run: |
          python -c "from studies.knapsack_parameters.population_validation_100.common import guard_technical; guard_technical()"
      - name: Test toy cases without running a main study
        run: python -m unittest studies.knapsack_parameters.population_validation_100.test_validation -v
      - name: Audit only 100-item inputs and exact references
        run: |
          python -m studies.knapsack_parameters.population_validation_100.preparation --out "$RUNNER_TEMP/population100-inputs"
      - name: Preserve preparation evidence, including partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: population100-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/population100-inputs
          retention-days: 30
          if-no-files-found: warn

  pilot:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        population: [10, 20, 30]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install frozen dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: population100-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/inputs
      - name: Run three old-task technical cases and independently replay them
        run: |
          python -m studies.knapsack_parameters.population_validation_100.pilot run --inputs "$RUNNER_TEMP/inputs" --mu ${{ matrix.population }} --out "$RUNNER_TEMP/pilot"
      - name: Preserve pilot evidence, including partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: population100-pilot-mu${{ matrix.population }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pilot
          retention-days: 30
          if-no-files-found: warn

  forecast:
    needs: pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install frozen dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: population100-pilot-mu*-${{ github.run_id }}
          path: ${{ runner.temp }}/pilots
      - name: Verify nine completed identities and estimate resources only
        run: |
          python -m studies.knapsack_parameters.population_validation_100.pilot forecast --artifacts "$RUNNER_TEMP/pilots" --out "$RUNNER_TEMP/forecast"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: population100-forecast-${{ github.run_id }}
          path: ${{ runner.temp }}/forecast
          retention-days: 30
          if-no-files-found: error
