name: Frozen adaptive strategies on 30 new parcel manifests
on:
  push:
    branches: [research/adaptive-threshold-validation]
    paths: [studies/knapsack_parameters/adaptive_threshold_validation/parcel-request.json]
permissions:
  actions: read
  contents: read
env:
  STUDY: studies.knapsack_parameters.adaptive_threshold_validation
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      blocks: ${{ steps.admit.outputs.blocks }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --require-hashes -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - run: python -m unittest "$STUDY.test_confirmatory" "$STUDY.test_donor_replay"
      - run: python -m "$STUDY.parcel_final" prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manifests
          path: manifests/
          if-no-files-found: error
      - id: admit
        run: python -c "import json; print('blocks='+json.dumps(list(range(150))))" >> "$GITHUB_OUTPUT"
  paired:
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        block: ${{ fromJSON(needs.admit.outputs.blocks) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --require-hashes -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45966006101
          name: frozen-finalists
          path: roles
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: manifests
          path: manifests
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: github.run_attempt != '1'
        with:
          pattern: parcel-raw-${{ matrix.block }}-*
          path: restored
      - run: python -m "$STUDY.parcel_final" run --shard ${{ matrix.block }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: parcel-raw-${{ matrix.block }}-${{ github.run_attempt }}
          path: raw/
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: parcel-summary-${{ matrix.block }}
          path: compact/
          overwrite: true
  compare:
    needs: paired
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --require-hashes -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45966006101
          name: frozen-finalists
          path: roles
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: parcel-summary-*
          path: collected
      - run: python -m "$STUDY.parcel_final" summarize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parcel-confirmatory-report
          path: |
            parcel-comparisons.json
            cargo-summary.csv
            collected/
