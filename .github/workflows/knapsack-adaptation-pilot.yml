name: Knapsack isolated adaptation - bounded scientific pilot

on:
  push:
    branches: [research/masters-ga-diversity-crossover]

permissions:
  contents: read
  actions: read

concurrency:
  group: knapsack-adaptation-scientific-pilot
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.sha }}
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  GITHUB_TOKEN: ${{ github.token }}
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  gate:
    if: contains(github.event.head_commit.message, '[adaptation-pilot:prepare]') || contains(github.event.head_commit.message, '[adaptation-pilot:pilot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate exact code, green checks and whole-phase resource reservation
        env:
          PILOT_PHASE: ${{ contains(github.event.head_commit.message, '[adaptation-pilot:prepare]') && 'prepare' || 'pilot' }}
        run: python3 -m studies.knapsack_parameters.adaptation_analysis.pilot_driver gate --phase "$PILOT_PHASE" --output "$RUNNER_TEMP/pilot-permit"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adaptation-pilot-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pilot-permit
          if-no-files-found: warn
          retention-days: 90

  prepare:
    needs: gate
    if: contains(github.event.head_commit.message, '[adaptation-pilot:prepare]')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Exact dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Verify central permit artifact and digest
        run: python -m studies.knapsack_parameters.adaptation_analysis.pilot_authority download --kind permit --output "$RUNNER_TEMP/permit"
      - name: Prepare exactly eight banks without search
        run: python -m studies.knapsack_parameters.adaptation_analysis.pilot_driver prepare --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/prepared"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adaptation-pilot-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared
          if-no-files-found: warn
          retention-days: 90

  pilot:
    needs: gate
    if: contains(github.event.head_commit.message, '[adaptation-pilot:pilot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: [UC-s000, WC-s001, SC-s005, SC-s000]
        start: [cloned, bank]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Exact dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Verify central permit artifact and digest
        run: python -m studies.knapsack_parameters.adaptation_analysis.pilot_authority download --kind permit --output "$RUNNER_TEMP/permit"
      - name: Five profiles on the frozen common beginning
        env:
          PILOT_TASK: ${{ matrix.task }}
          PILOT_START: ${{ matrix.start }}
        run: python -m studies.knapsack_parameters.adaptation_analysis.pilot_driver worker --task "$PILOT_TASK" --start "$PILOT_START" --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/worker"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adaptation-pilot-worker-${{ matrix.task }}-${{ matrix.start }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    needs: [gate, pilot]
    if: always() && needs.gate.result == 'success' && contains(github.event.head_commit.message, '[adaptation-pilot:pilot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Exact dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Obtain authenticated permit and all available worker artifacts
        run: |
          python -m studies.knapsack_parameters.adaptation_analysis.pilot_authority download --kind permit --output "$RUNNER_TEMP/permit"
          python -m studies.knapsack_parameters.adaptation_analysis.pilot_authority download --kind workers --output "$RUNNER_TEMP/workers"
      - name: Independently replay all source journals and preserve incompleteness
        run: python -m studies.knapsack_parameters.adaptation_analysis.pilot_driver aggregate --permit "$RUNNER_TEMP/permit" --artifacts "$RUNNER_TEMP/workers" --output "$RUNNER_TEMP/aggregate"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adaptation-pilot-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aggregate
          if-no-files-found: warn
          retention-days: 90
