name: Knapsack two-signal mutation study

on:
  push:
    branches: [research/masters-ga-diversity-crossover]

permissions:
  contents: read
  actions: read

concurrency:
  group: knapsack-two-signal-mutation
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.sha }}
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  GITHUB_TOKEN: ${{ github.token }}
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  gate:
    if: contains(github.event.head_commit.message, '[two-signal:')
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      phase: ${{ steps.permit.outputs.phase }}
      worker_timeout: ${{ steps.permit.outputs.worker_timeout }}
      aggregate_timeout: ${{ steps.permit.outputs.aggregate_timeout }}
      prepare_timeout: ${{ steps.permit.outputs.prepare_timeout }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: permit
        name: Exact registration, explicit approval and cumulative resource reservation
        run: python3 -m studies.knapsack_parameters.two_signal_mutation.driver preflight --output "$RUNNER_TEMP/two-signal-permit"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: two-signal-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/two-signal-permit
          retention-days: 90
          if-no-files-found: warn

  tests:
    needs: gate
    if: needs.gate.outputs.phase == 'tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: two-signal-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permit
      - name: Software fixtures only, no KPLIB search or bootstrap series
        run: python -m studies.knapsack_parameters.two_signal_mutation.driver tests --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/two-signal-tests"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: two-signal-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/two-signal-tests
          retention-days: 90
          if-no-files-found: warn

  prepare:
    needs: gate
    if: needs.gate.outputs.phase == 'prepare-pilot' || needs.gate.outputs.phase == 'prepare-main'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.gate.outputs.prepare_timeout) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: two-signal-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permit
      - name: Prepare and hash common beginnings; no GA or exact solving
        env:
          STUDY_STAGE: ${{ needs.gate.outputs.phase == 'prepare-pilot' && 'pilot' || 'main' }}
        run: python -m studies.knapsack_parameters.two_signal_mutation.driver prepare --stage "$STUDY_STAGE" --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/two-signal-inputs"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: two-signal-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/two-signal-inputs
          retention-days: 90
          if-no-files-found: warn

  pilot:
    name: pilot (${{ matrix.task }})
    needs: gate
    if: needs.gate.outputs.phase == 'pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.gate.outputs.worker_timeout) }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: [UC-s000, WC-s001, SC-s005, SC-s000]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: two-signal-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permit
      - name: Three profiles, two frozen beginnings and independent replay
        env:
          STUDY_WORKER: ${{ matrix.task }}
        run: python -m studies.knapsack_parameters.two_signal_mutation.driver worker --stage pilot --worker "$STUDY_WORKER" --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/two-signal-worker"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: two-signal-worker-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/two-signal-worker
          retention-days: 90
          if-no-files-found: warn

  main:
    name: main (${{ matrix.family }})
    needs: gate
    if: needs.gate.outputs.phase == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.gate.outputs.worker_timeout) }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        family: [s010, s011, s012, s013, s014, s015, s016, s017, s018, s019]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: two-signal-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permit
      - name: Approved held-out family only, all paired repetitions
        env:
          STUDY_WORKER: ${{ matrix.family }}
        run: python -m studies.knapsack_parameters.two_signal_mutation.driver worker --stage main --worker "$STUDY_WORKER" --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/two-signal-worker"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: two-signal-worker-${{ matrix.family }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/two-signal-worker
          retention-days: 90
          if-no-files-found: warn

  aggregate:
    needs: [gate, pilot, main]
    if: always() && needs.gate.result == 'success' && (needs.gate.outputs.phase == 'pilot' || needs.gate.outputs.phase == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.gate.outputs.aggregate_timeout) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: two-signal-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: two-signal-worker-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workers
          merge-multiple: false
      - name: Completeness, exact producers, question-led analysis and figures
        env:
          STUDY_STAGE: ${{ needs.gate.outputs.phase }}
        run: python -m studies.knapsack_parameters.two_signal_mutation.driver aggregate --stage "$STUDY_STAGE" --workers "$RUNNER_TEMP/workers" --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/two-signal-summary"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: two-signal-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/two-signal-summary
          retention-days: 90
          if-no-files-found: warn
