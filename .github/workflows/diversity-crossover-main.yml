name: Diversity crossover registered main series

on:
  push:
    branches: [research/masters-ga-diversity-crossover]

permissions:
  contents: read
  actions: read

concurrency:
  group: diversity-crossover-main-series
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.sha }}
  STUDY_WORKFLOW_SHA: ${{ github.sha }}
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  phase:
    if: contains(github.event.head_commit.message, '[diversity-main:')
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      phase: ${{ steps.authority.outputs.phase }}
      matrix: ${{ steps.authority.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: authority
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m studies.diversity_crossover.main_study.contract --output "$RUNNER_TEMP/budget"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diversity-main-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/budget
          if-no-files-found: warn
          retention-days: 90

  tests:
    needs: phase
    if: needs.phase.outputs.phase == 'tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m studies.diversity_crossover.main_study.ci_support tests --output "$RUNNER_TEMP/tests"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diversity-main-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tests
          if-no-files-found: warn
          retention-days: 90

  prepare:
    needs: phase
    if: needs.phase.outputs.phase == 'prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m studies.diversity_crossover.main_study.inputs --expected-sha "$EXPECTED_SHA" --output "$RUNNER_TEMP/starts"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diversity-main-starts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/starts
          if-no-files-found: warn
          retention-days: 90

  main:
    name: main (${{ matrix.id }})
    needs: phase
    if: needs.phase.outputs.phase == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.kind == 'diagnostic' && 8 || 10 }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.phase.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Fixed searches and independent journal reconstruction
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_KIND: ${{ matrix.kind }}
          JOB_TASK: ${{ matrix.task }}
          JOB_BLOCK: ${{ matrix.block }}
        run: |
          if [ "$JOB_KIND" = diagnostic ]; then
            python -m studies.diversity_crossover.main_study.runner --diagnostic-block "$JOB_BLOCK" --expected-sha "$EXPECTED_SHA" --output "$RUNNER_TEMP/main"
          else
            python -m studies.diversity_crossover.main_study.runner --task "$JOB_TASK" --block "$JOB_BLOCK" --expected-sha "$EXPECTED_SHA" --output "$RUNNER_TEMP/main"
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diversity-main-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}-full
          path: ${{ runner.temp }}/main/full
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diversity-main-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}-compact
          path: ${{ runner.temp }}/main/compact
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90

  aggregate:
    needs: [phase, main]
    if: always() && needs.phase.result == 'success' && (needs.phase.outputs.phase == 'main' || needs.phase.outputs.phase == 'aggregate')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          AGGREGATION_PHASE: ${{ needs.phase.outputs.phase }}
        run: python -m studies.diversity_crossover.main_study.ci_support aggregate --output "$RUNNER_TEMP/report"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diversity-main-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report
          if-no-files-found: warn
          retention-days: 90

  closure:
    needs: [phase, tests, prepare, main, aggregate]
    if: always() && needs.phase.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m studies.diversity_crossover.main_study.ci_support closure --output "$RUNNER_TEMP/usage"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diversity-main-usage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/usage
          if-no-files-found: warn
          retention-days: 90
