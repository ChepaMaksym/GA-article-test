name: Bounded lambda paper audit and technical pilot

on:
  push:
    branches: [research/masters-ga-knapsack-parameters]

permissions:
  contents: read
  actions: read

concurrency:
  group: lambda-paper-${{ github.sha }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.sha }}
  STUDY_WORKFLOW_SHA: ${{ github.workflow_sha }}
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  phase:
    name: Select and reserve one authorized bounded phase
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      phase: ${{ steps.select.outputs.phase }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          from studies.knapsack_parameters.lambda_study.contract import budget_preflight, require, write_file_manifest, write_json
          selected = re.findall(r'\[lambda-paper:([^\]]+)\]', os.environ.get('COMMIT_MESSAGE', ''))
          require(len(selected) <= 1 and all(item in ('audit', 'tests', 'pilot') for item in selected), 'Ambiguous or unauthorized paper marker')
          phase = selected[0] if selected else 'none'
          if phase != 'none':
              output = Path(os.environ['RUNNER_TEMP']) / 'lambda-paper-budget'
              write_json(output / 'budget-preflight.json', budget_preflight(phase))
              write_file_manifest(output)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as target:
              target.write(f'phase={phase}\n')
          print(f'Bounded stage: {phase}; full reproduction and knapsack execution unavailable')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.select.outputs.phase != 'none' && steps.select.outcome == 'success'
        with:
          name: lambda-paper-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lambda-paper-budget
          retention-days: 90
          if-no-files-found: error

  audit:
    name: Pinned sources, licenses, inputs and offline fixtures
    needs: phase
    if: needs.phase.outputs.phase == 'audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Authenticate exact registered checkout before CI fixtures
        run: |
          python - <<'PY'
          import os
          from studies.knapsack_parameters.lambda_study.contract import authenticate
          authenticate(os.environ['EXPECTED_SHA'])
          PY
      - name: Independent small offline source fixtures
        run: |
          python -m unittest discover -s studies/knapsack_parameters/lambda_study/tests -p 'test_source_audit.py' -v
          python -m unittest discover -s studies/knapsack_parameters/lambda_study/tests -p 'test_contract.py' -v
      - name: Audit fixed author source and all 1400 Ising inputs
        id: audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m studies.knapsack_parameters.lambda_study.source_audit
          --expected-sha "$EXPECTED_SHA" --output "$RUNNER_TEMP/lambda-paper-audit"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.audit.outcome != 'skipped'
        with:
          name: lambda-paper-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lambda-paper-audit/transport
          # A hash-bound TAR preserves the upstream colon paths and dotfiles.
          # Upload only its portable envelope, not those names as ZIP members.
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.audit.outcome != 'skipped'
        with:
          name: lambda-paper-audit-compact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lambda-paper-audit/compact
          retention-days: 90
          if-no-files-found: error

  tests:
    name: CI-only bounded pilot and provenance fixtures
    needs: phase
    if: needs.phase.outputs.phase == 'tests' || needs.phase.outputs.phase == 'pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install hash-frozen audit runtime
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r studies/knapsack_parameters/lambda_study/requirements.author.lock
          python - <<'PY'
          import os
          from studies.knapsack_parameters.lambda_study.contract import authenticate
          authenticate(os.environ['EXPECTED_SHA'])
          PY
      - name: Fake and small fixtures only; no paper matrix
        id: fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/lambda-paper-tests"
          set -o pipefail
          python -m unittest discover -s studies/knapsack_parameters/lambda_study/tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/lambda-paper-tests/fixtures.txt"
      - name: Record fixture outcome including failures
        if: always()
        env:
          FIXTURE_OUTCOME: ${{ steps.fixtures.outcome }}
        run: >-
          python -m studies.knapsack_parameters.lambda_study.pilot record-tests
          --expected-sha "$EXPECTED_SHA" --outcome "$FIXTURE_OUTCOME"
          --output "$RUNNER_TEMP/lambda-paper-tests"
      - name: Require unchanged scientific checkout
        if: always()
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lambda-paper-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lambda-paper-tests
          retention-days: 90
          if-no-files-found: error

  pilot:
    name: Technical prefix ${{ matrix.case }}
    needs: [phase, tests]
    if: needs.phase.outputs.phase == 'pilot' && needs.tests.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [onemax-100, jump-20-2, maxsat-10]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install hash-frozen audit runtime
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r studies/knapsack_parameters/lambda_study/requirements.author.lock
      - name: One frozen source/profile/seed; max 100000 calls or 30 GA seconds
        id: probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m studies.knapsack_parameters.lambda_study.pilot run
          --case '${{ matrix.case }}' --expected-sha "$EXPECTED_SHA"
          --output "$RUNNER_TEMP/lambda-paper-pilot"
      - name: Require unchanged scientific checkout
        if: always()
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.probe.outcome != 'skipped'
        with:
          name: lambda-paper-pilot-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lambda-paper-pilot
          retention-days: 90
          if-no-files-found: error

  aggregate:
    name: Exact artifact provenance, failures and bounded resource report
    needs: [phase, audit, tests, pilot]
    if: always() && contains(fromJSON('["audit","tests","pilot"]'), needs.phase.outputs.phase)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Collect this exact completed audit/test or complete three-job matrix
        id: report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m studies.knapsack_parameters.lambda_study.pilot aggregate
          --phase '${{ needs.phase.outputs.phase }}' --expected-sha "$EXPECTED_SHA"
          --output "$RUNNER_TEMP/lambda-paper-report"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.report.outcome != 'skipped'
        with:
          name: lambda-paper-report-${{ needs.phase.outputs.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lambda-paper-report
          retention-days: 90
          if-no-files-found: error
