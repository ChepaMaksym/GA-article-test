name: Knapsack sourced mutation rules - tests only

on:
  push:
    branches: [research/masters-ga-diversity-crossover]

permissions:
  contents: read
  actions: read

concurrency:
  group: knapsack-mutation-population
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.sha }}
  GITHUB_TOKEN: ${{ github.token }}
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  tests:
    if: contains(github.event.head_commit.message, '[mutation-rules:tests]')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen source, historical hashes, and shared resource allowance
        run: python3 -m studies.knapsack_parameters.mutation_rules.driver preflight --output "$RUNNER_TEMP/mutation-rules"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Unchanged scientific dependency lock
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Independent controller and reconstruction fixtures; no scientific pilot
        run: python -m studies.knapsack_parameters.mutation_rules.driver tests --output "$RUNNER_TEMP/mutation-rules"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-rules-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-rules
          if-no-files-found: warn
          retention-days: 90
