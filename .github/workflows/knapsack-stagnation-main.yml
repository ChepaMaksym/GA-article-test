name: Knapsack stagnation diagnosis - authorized main series

on:
  push:
    branches: [research/masters-ga-diversity-crossover]

permissions:
  contents: read
  actions: read

concurrency:
  group: knapsack-stagnation-main-budget
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.sha }}
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  GITHUB_TOKEN: ${{ github.token }}
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  gate:
    if: contains(github.event.head_commit.message, '[knapsack-stagnation-main:')
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      phase: ${{ steps.authority.outputs.phase }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact main-series phase and separate cumulative grant
        id: authority
        run: |
          PHASE=$(python3 -c 'import os; from studies.knapsack_parameters.stagnation_diagnosis_main.contract import phase; print(phase(os.environ["COMMIT_MESSAGE"]))')
          python3 -m studies.knapsack_parameters.stagnation_diagnosis_main.execution gate --phase "$PHASE" --output "$RUNNER_TEMP/permit"
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knapsack-stagnation-main-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permit
          if-no-files-found: warn
          retention-days: 90

  tests:
    needs: gate
    if: needs.gate.outputs.phase == 'tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Exact hash-locked environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Retrieve exact central permit
        run: python -m studies.knapsack_parameters.stagnation_diagnosis_main.execution download --kind permit --output "$RUNNER_TEMP/permit"
      - name: New authority and replay checks plus unchanged scientific regressions
        run: python -m studies.knapsack_parameters.stagnation_diagnosis_main.execution tests --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/tests"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knapsack-stagnation-main-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tests
          if-no-files-found: warn
          retention-days: 90

  worker:
    needs: gate
    if: needs.gate.outputs.phase == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        instance: [UC-s000, UC-s001, UC-s002, UC-s003, UC-s004, UC-s005, UC-s006, UC-s007, UC-s008, UC-s009, WC-s000, WC-s001, WC-s002, WC-s003, WC-s004, WC-s005, WC-s006, WC-s007, WC-s008, WC-s009, SC-s000, SC-s001, SC-s002, SC-s003, SC-s004, SC-s005, SC-s006, SC-s007, SC-s008, SC-s009]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Exact hash-locked environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Retrieve exact central permit
        run: python -m studies.knapsack_parameters.stagnation_diagnosis_main.execution download --kind permit --output "$RUNNER_TEMP/permit"
      - name: Thirty frozen repetitions for one instance
        env:
          MAIN_INSTANCE: ${{ matrix.instance }}
        run: python -m studies.knapsack_parameters.stagnation_diagnosis_main.execution worker --instance-id "$MAIN_INSTANCE" --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/worker"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knapsack-stagnation-main-worker-${{ matrix.instance }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    needs: [gate, worker]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.phase == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Exact hash-locked environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Retrieve exact central permit
        run: python -m studies.knapsack_parameters.stagnation_diagnosis_main.execution download --kind permit --output "$RUNNER_TEMP/permit"
      - name: Authenticated transport of all available workers
        continue-on-error: true
        run: python -m studies.knapsack_parameters.stagnation_diagnosis_main.execution download --kind workers --output "$RUNNER_TEMP/workers"
      - name: Independently reconstruct every saved run and certify all observations
        run: python -m studies.knapsack_parameters.stagnation_diagnosis_main.execution aggregate --permit "$RUNNER_TEMP/permit" --artifacts "$RUNNER_TEMP/workers" --output "$RUNNER_TEMP/summary"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knapsack-stagnation-main-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/summary
          if-no-files-found: warn
          retention-days: 90
