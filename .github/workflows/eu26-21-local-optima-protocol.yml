name: EU26-21 local optima protocol registration

on:
  push:
    branches: [research/EU26-21-chcqx-census-old-first]
    paths:
      - 'candidates/EU26-21/local_optima_study/protocol.json'
      - 'candidates/EU26-21/local_optima_study/PROTOCOL_UK.md'
      - '.github/workflows/eu26-21-local-optima-protocol.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check the registered contract without algorithms or data
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          path = Path('candidates/EU26-21/local_optima_study/protocol.json')
          p = json.loads(path.read_text(encoding='utf-8'))
          assert p['schema'] == 'eu26-21-local-optima-protocol-v1'
          assert p['rng']['case_seeds'] == list(range(42001,42031))
          assert p['rng']['escape_repeats'] == [1,2,3,4,5]
          assert p['objective']['empty_mask_fitness'] == [0.0,-1.0]
          assert p['search']['fixed_lambda'] == 1.0
          assert p['search']['reset'] is False
          assert p['preparation']['max_diagnostic_calls_per_case'] == 1+20*40+41+780
          assert p['escape']['objective_calls_per_arm'] == 400
          assert p['escape']['initial_parent_consumes_search_call'] is False
          assert p['analysis']['bootstrap_resamples'] == 50000
          assert p['claims']['merge_authorized'] is False
          expected = 30*3*400+30*1622+30*5*2*400+30*3
          assert p['execution']['max_validation_calls_total'] == expected
          print(json.dumps({'registration_sha': os.environ['GITHUB_SHA'],
                            'protocol_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                            'protocol_id': p['protocol_id'],
                            'scientific_outcomes_computed': False}, indent=2))
          PY
