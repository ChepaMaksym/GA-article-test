name: EU26-27 historical dependency recovery

on:
  pull_request:
    branches:
      - research/EU26-07-reset-jump-verification
    paths:
      - '.github/workflows/eu26-27-historical-dependency-recovery.yml'
      - 'candidates/EU26-27/preregistration/HISTORICAL_DEPENDENCY_RECOVERY.md'
      - 'candidates/EU26-27/source_native/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  GSEMO_SHA: fbe1d3ed3064dedd85ba3c5eaf78fe4ea3d6b380
  IOH_SHA: 8d21f4f6b46844d037c6a8740db2a56a1c940e0f

jobs:
  d01-historical-dependency:
    name: D01 compatible old IOH core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Fetch exact author source and D01 dependency
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            repo="$1"
            path="$2"
            expected="$3"
            observed="$(git -C "$repo" hash-object "$path")"
            printf 'IDENTITY %s/%s observed=%s expected=%s\n' "$repo" "$path" "$observed" "$expected"
            if [ "$observed" != "$expected" ]; then
              echo "IDENTITY_MISMATCH: $repo/$path" >&2
              exit 1
            fi
          }

          git config --global url."https://github.com/".insteadOf "git@github.com:"
          mkdir -p upstream
          git clone --filter=blob:none https://github.com/FurongYe/GSEMO.git upstream/GSEMO
          git -C upstream/GSEMO checkout --detach "$GSEMO_SHA"
          git clone --filter=blob:none https://github.com/IOHprofiler/IOHexperimenter.git upstream/IOHexperimenter
          git -C upstream/IOHexperimenter checkout --detach "$IOH_SHA"
          git -C upstream/IOHexperimenter submodule sync --recursive
          git -C upstream/IOHexperimenter submodule update --init --recursive

          observed_gsemo="$(git -C upstream/GSEMO rev-parse HEAD)"
          observed_ioh="$(git -C upstream/IOHexperimenter rev-parse HEAD)"
          echo "GSEMO_HEAD observed=$observed_gsemo expected=$GSEMO_SHA"
          echo "IOH_HEAD observed=$observed_ioh expected=$IOH_SHA"
          test "$observed_gsemo" = "$GSEMO_SHA"
          test "$observed_ioh" = "$IOH_SHA"

          check_blob upstream/GSEMO src/gsemo.hpp 2693144bcfccff902343a02c6c8e48d7dd263257
          check_blob upstream/GSEMO src/main.cpp 22025e4680da85c98e3bb5ea30db8334ca25dff3
          check_blob upstream/GSEMO src/problems.cpp cd9b520253e3b0b0390e35bf4fb86d4249c204de

          check_blob upstream/IOHexperimenter include/ioh/common/random.hpp b032b0b6df43083d58ff287b2112958ddc3d572e
          check_blob upstream/IOHexperimenter include/ioh/problem/constraints.hpp b64d88fac38a7e3a1c4be7c35d9557f4d4a1074a
          check_blob upstream/IOHexperimenter include/ioh/problem/problem.hpp 8ee2fa46233a7730267bd10edc50f33aef46100c
          check_blob upstream/IOHexperimenter include/ioh/problem/single.hpp d9f4143424bd20abac6f9922a89ec7e5fd642a17
          check_blob upstream/IOHexperimenter include/ioh/problem/pbo.hpp 1d74dbf2d12612c18ad425e167baeede6c178705

          rm -rf upstream/GSEMO/include upstream/GSEMO/external
          cp -R upstream/IOHexperimenter/include upstream/GSEMO/include
          cp -R upstream/IOHexperimenter/external upstream/GSEMO/external

      - name: Build and run frozen 100-run OLD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependency-run dependency-bin
          docker pull gcc:10
          docker image inspect gcc:10 --format '{{index .RepoDigests 0}}' | tee dependency-run/compiler-image.txt
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            gcc:10 \
            bash -lc '
              set -euo pipefail
              g++ --version | tee /work/dependency-run/compiler.txt
              g++ -std=c++17 -O3 -DNDEBUG \
                -I/work/upstream/GSEMO/include \
                -I/work/upstream/GSEMO/src \
                -I/work/upstream/GSEMO/external/fmt/include \
                -I/work/upstream/GSEMO/external/cxxopts/include \
                -I/work/upstream/GSEMO/external/json/include \
                /work/upstream/GSEMO/src/problems.cpp \
                /work/upstream/GSEMO/src/main.cpp \
                -o /work/dependency-bin/gsemo
              cd /work/dependency-run
              /work/dependency-bin/gsemo 1 100 TwoRate 10 1 1 100000 100 > stdout.txt
              test -n "$(find . -name "*.json" -type f | head -n 1)"
            '

      - name: Verify immutable source and dependency blobs after execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream/GSEMO hash-object src/gsemo.hpp)" = "2693144bcfccff902343a02c6c8e48d7dd263257"
          test "$(git -C upstream/GSEMO hash-object src/main.cpp)" = "22025e4680da85c98e3bb5ea30db8334ca25dff3"
          test "$(git -C upstream/GSEMO hash-object src/problems.cpp)" = "cd9b520253e3b0b0390e35bf4fb86d4249c204de"
          test "$(git -C upstream/IOHexperimenter hash-object include/ioh/common/random.hpp)" = "b032b0b6df43083d58ff287b2112958ddc3d572e"
          test "$(git -C upstream/IOHexperimenter hash-object include/ioh/problem/constraints.hpp)" = "b64d88fac38a7e3a1c4be7c35d9557f4d4a1074a"
          test "$(git -C upstream/IOHexperimenter hash-object include/ioh/problem/problem.hpp)" = "8ee2fa46233a7730267bd10edc50f33aef46100c"
          test "$(git -C upstream/IOHexperimenter hash-object include/ioh/problem/single.hpp)" = "d9f4143424bd20abac6f9922a89ec7e5fd642a17"

      - name: Diagnose exact authenticated Zenodo replay
        shell: bash
        run: |
          set -euo pipefail
          python candidates/EU26-27/source_native/diagnose_historical_environment.py \
            --author-output-root dependency-run \
            --output-dir evidence/dependency-d01 \
            --compiler-label GCC10-D01-8d21f4f \
            --gsemo-sha "$GSEMO_SHA" \
            --ioh-sha "$IOH_SHA"
          cat evidence/dependency-d01/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload D01 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eu26-27-historical-dependency-d01-8d21f4f
          if-no-files-found: warn
          retention-days: 90
          path: |
            evidence/dependency-d01/**
            dependency-run/compiler.txt
            dependency-run/compiler-image.txt
            dependency-run/stdout.txt
            dependency-run/**/*.json
            dependency-run/**/*.dat
