name: Cohort 2026 formula validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/cohort-2026-12
    paths:
      - "candidates/USA26-01/**"
      - "registry/cohort_2026_12/**"
      - "plans/cohort-2026-12-preregistration.md"
      - "plans/amendments/2026-08-06-adaptive-definition-gates.md"
      - "plans/amendments/2026-08-06-no-inverse.md"
      - ".github/workflows/cohort-2026-formula-validation.yml"
  pull_request:
    paths:
      - "candidates/USA26-01/**"
      - "registry/cohort_2026_12/**"
      - "plans/cohort-2026-12-preregistration.md"
      - "plans/amendments/2026-08-06-adaptive-definition-gates.md"
      - "plans/amendments/2026-08-06-no-inverse.md"
      - ".github/workflows/cohort-2026-formula-validation.yml"

permissions:
  contents: read

jobs:
  registry-gates:
    name: Direct adaptive-GA eligibility gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the frozen branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate 12 records and hard gates 3-10
        run: python registry/cohort_2026_12/validate_registry.py
      - name: Run fail-closed registry mutation tests
        run: python registry/cohort_2026_12/tests/run_registry_tests.py

  python-formula:
    name: Python 3.12 formula gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the frozen branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: candidates/USA26-01/environments/python/requirements.txt
      - name: Install the pinned numerical dependency
        run: python -m pip install --requirement candidates/USA26-01/environments/python/requirements.txt
      - name: Run formula, property, protocol, and fixed-tape tests
        run: python candidates/USA26-01/tests/run_python_tests.py

  octave-formula:
    name: GNU Octave formula gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the frozen branch
        uses: actions/checkout@v4
      - name: Install GNU Octave
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends octave
      - name: Run MATLAB-compatible fixed-tape and property tests
        run: octave --quiet --eval "addpath('candidates/USA26-01/tests/matlab'); run_matlab_tests"

  github-four-core:
    name: GitHub 4-vCPU portability profile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - name: Check out the frozen branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: candidates/USA26-01/environments/python/requirements.txt
      - name: Install the pinned numerical dependency
        run: python -m pip install --requirement candidates/USA26-01/environments/python/requirements.txt
      - name: Record runner hardware
        run: |
          lscpu
          cat /sys/fs/cgroup/cpu.max || true
          cat /sys/fs/cgroup/cpuset.cpus.effective || true
      - name: Run the frozen 4-vCPU profile
        run: |
          python candidates/USA26-01/tests/hardware/run_portability_suite.py \
            --label github-4core-x64 \
            --workers 4 \
            --logical-cpus 4 \
            --timing-repeats 5 \
            --output hardware-artifacts/github-4core.json \
            --hashes hardware-artifacts/github-4core-hashes.tsv
      - name: Upload the immutable profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesmr-github-4core-profile
          path: hardware-artifacts/
          if-no-files-found: error
          retention-days: 30
