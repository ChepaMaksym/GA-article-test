name: Independent adaptive mechanism and threshold validation
on:
  push:
    branches: [research/adaptive-threshold-validation]
    paths: [studies/knapsack_parameters/adaptive_threshold_validation/independent-request.json]
permissions:
  actions: read
  contents: read
env:
  STUDY: studies.knapsack_parameters.adaptive_threshold_validation
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      blocks: ${{ steps.admit.outputs.blocks }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: admit
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import os,json
          base=Path('studies/knapsack_parameters/adaptive_threshold_validation')
          request=json.loads((base/'independent-request.json').read_bytes())
          audit=(base/'historical-admission.json').read_bytes()
          evidence=json.loads(audit)
          if (sha256(audit).hexdigest()!=request['audit_sha256'] or evidence['decision']!='ADMIT'
                  or evidence['unresolved'] or len(set(evidence['tasks']))!=30
                  or request['recipient_runs']!=4200 or request['donor_runs']!=1200):
              raise ValueError("Historical admission or registered counts differ")
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              print('blocks='+json.dumps(list(range(150))),file=out)
          PY
  paired:
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        block: ${{ fromJSON(needs.admit.outputs.blocks) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --require-hashes -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45966006101
          name: frozen-finalists
          path: roles
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45966006101
          name: certified-holdout-inputs
          path: inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: github.run_attempt != '1'
        with:
          pattern: independent-raw-${{ matrix.block }}-*
          path: restored
      - run: python -m "$STUDY.holdout" run --shard ${{ matrix.block }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-raw-${{ matrix.block }}-${{ github.run_attempt }}
          path: raw/
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-summary-${{ matrix.block }}
          path: compact/
          overwrite: true
  compare:
    needs: paired
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --require-hashes -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45966006101
          name: frozen-finalists
          path: roles
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: independent-summary-*
          path: collected
      - run: python -m "$STUDY.holdout" summarize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-confirmatory-report
          path: |
            independent-comparisons.json
            collected/
