name: Parcel selection for one vehicle trip
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parcel-transfer
  cancel-in-progress: false
env:
  M: studies.knapsack_parameters.parcel_transfer
  LOCK: studies/knapsack_parameters/ga_study/dependencies/requirements.lock
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MPLBACKEND: Agg
jobs:
  prepare:
    if: github.ref == 'refs/heads/research/parcel-transfer'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r "$LOCK"
      # Each physical case is independently replayed.
      - run: python -m "$M.study" prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parcel-inputs
          path: stage/inputs
          if-no-files-found: error
          retention-days: 30
  compare:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        index: [1,2,3,4,5,6]
        pc: [90,100]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r "$LOCK"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: parcel-inputs
          path: stage/inputs
      - run: python -m "$M.study" run --trip ${{ matrix.index }} --pc ${{ matrix.pc }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: parcel-logs-${{ matrix.index }}-${{ matrix.pc }}
          path: |
            stage/evidence/**/*.gz
            stage/evidence/**/donor-schedule.json
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: parcel-compact-${{ matrix.index }}-${{ matrix.pc }}
          path: stage/evidence/**/*.receipt.json
          retention-days: 30
  report:
    needs: compare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r "$LOCK"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: parcel-compact-*
          path: stage/collected
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: parcel-inputs
          path: stage/inputs
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer
          python -m "$M.report"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parcel-report
          path: stage/report
          if-no-files-found: error
          retention-days: 90
