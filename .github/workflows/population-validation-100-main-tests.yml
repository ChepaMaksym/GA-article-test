name: Knapsack 100-item population validation - synthetic main-code tests

on:
  workflow_dispatch:
  push:
    branches:
      - research/population100-main-tests-20261110
    paths:
      - studies/knapsack_parameters/population_validation_100_main/**
      - .github/workflows/population-validation-100-main-tests.yml

permissions:
  contents: read

concurrency:
  group: population-validation-100-main-tests-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MPLBACKEND: Agg

jobs:
  synthetic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install frozen dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Verify technical authority and prospective source seal
        run: |
          python -c "from studies.knapsack_parameters.population_validation_100.common import guard_technical; from studies.knapsack_parameters.population_validation_100_main.common import verify_source; guard_technical(); verify_source()"
          python -c "from studies.knapsack_parameters.population_validation_100_main.common import HERE, read_json; a=read_json(HERE/'resource_authorization.json'); assert a['status']=='PENDING_USER_APPROVAL' and a['runner_minutes']==0 and a['artifact_bytes']==0"
          python -c "from studies.knapsack_parameters.population_validation_100_main.common import HERE, read_json; x=read_json(HERE/'data/technical_test_budget.json'); assert x['completed_job_rounded_upper_minutes']+x['synthetic_test_job_timeout_minutes']<=x['technical_authorization_minutes']==30; assert x['completed_artifact_bytes']<x['technical_authorization_bytes']==1073741824 and x['main_stage_authorized'] is False"
      - name: Test synthetic accounting, limits and statistical edge cases
        run: |
          python -m unittest studies.knapsack_parameters.population_validation_100_main.test_runner studies.knapsack_parameters.population_validation_100_main.test_analysis -v
