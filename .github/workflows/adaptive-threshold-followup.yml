name: Finalist thresholds and static controls
on:
  push:
    branches: [research/adaptive-threshold-validation]
    paths: [studies/knapsack_parameters/adaptive_threshold_validation/followup.py]
permissions:
  actions: read
  contents: read
env:
  STUDY: studies.knapsack_parameters.adaptive_threshold_validation.followup
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  register:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --require-hashes -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45899446917
          name: screening-selection-45899446917-1
          path: prior
      - run: python -m "$STUDY" gate
      - id: matrix
        run: python -c "import json; print('shards='+json.dumps(list(range(90))))" >> "$GITHUB_OUTPUT"
  paired:
    needs: register
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.register.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --require-hashes -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: github.run_attempt != '1'
        with:
          pattern: follow-raw-${{ matrix.shard }}-*
          path: restored
      - run: python -m "$STUDY" run --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: follow-raw-${{ matrix.shard }}-${{ github.run_attempt }}
          path: raw/
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: follow-summary-${{ matrix.shard }}
          path: compact/
          overwrite: true
  aggregate:
    needs: paired
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --require-hashes -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: follow-summary-*
          path: collected
      - run: python -m "$STUDY" summarize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: followup-report
          path: |
            followup.csv
            collected/
