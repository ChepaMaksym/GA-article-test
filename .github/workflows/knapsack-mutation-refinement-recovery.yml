name: Knapsack mutation refinement retained aggregation

on:
  push:
    branches: [research/masters-ga-diversity-crossover]

permissions:
  contents: read
  actions: read

concurrency:
  group: knapsack-mutation-refinement
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.sha }}
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  GITHUB_TOKEN: ${{ github.token }}
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MPLBACKEND: Agg

jobs:
  gate:
    if: contains(github.event.head_commit.message, '[mutation-refinement-recovery:aggregate]')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Shared sixty-minute balance and exact successful source jobs
        run: python3 -m studies.knapsack_parameters.mutation_refinement_recovery.driver preflight --output "$RUNNER_TEMP/recovery-permit"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-refinement-recovery-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-permit
          retention-days: 90
          if-no-files-found: warn

  aggregate:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mutation-refinement-recovery-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mutation-refinement-*-40516606272-1
          run-id: 40516606272
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retained-source
          merge-multiple: false
      - name: Software fixtures and retained-only aggregation; no search
        run: python -m studies.knapsack_parameters.mutation_refinement_recovery.driver recover --permit "$RUNNER_TEMP/permit" --workers "$RUNNER_TEMP/retained-source" --output "$RUNNER_TEMP/recovery-summary"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-refinement-recovery-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-summary
          retention-days: 90
          if-no-files-found: warn
