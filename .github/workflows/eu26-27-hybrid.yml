name: EU26-27 HYBRID confirmatory

on:
  workflow_dispatch:
  pull_request:
    branches:
      - research/EU26-27-agsemo-recovery
    paths:
      - 'candidates/EU26-27/hybrid/**'
      - '.github/workflows/eu26-27-hybrid.yml'
  push:
    branches:
      - research/EU26-27-hybrid-reset-controller
    paths:
      - 'candidates/EU26-27/hybrid/**'
      - '.github/workflows/eu26-27-hybrid.yml'

concurrency:
  group: eu26-27-hybrid-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GSEMO_SHA: fbe1d3ed3064dedd85ba3c5eaf78fe4ea3d6b380
  IOH_SHA: f223c682dff0749067d00b870f83ad754f7d96f5
  SAFETY_CAP_FE: '10000000'

jobs:
  confirmatory:
    name: OLD regression + paired HYBRID
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run preregistered formula/statistics unit tests
        run: |
          set -euo pipefail
          cd candidates/EU26-27/hybrid
          python test_hybrid.py

      - name: Checkout exact OLD source and paper-era dependency
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          mkdir -p upstream
          git clone --filter=blob:none https://github.com/FurongYe/GSEMO.git upstream/GSEMO
          git -C upstream/GSEMO checkout --detach "$GSEMO_SHA"
          git clone --filter=blob:none https://github.com/IOHprofiler/IOHexperimenter.git upstream/IOHexperimenter
          git -C upstream/IOHexperimenter checkout --detach "$IOH_SHA"
          git -C upstream/IOHexperimenter submodule sync --recursive
          git -C upstream/IOHexperimenter submodule update --init --recursive
          test "$(git -C upstream/GSEMO rev-parse HEAD)" = "$GSEMO_SHA"
          test "$(git -C upstream/IOHexperimenter rev-parse HEAD)" = "$IOH_SHA"
          test "$(git -C upstream/GSEMO hash-object src/gsemo.hpp)" = "2693144bcfccff902343a02c6c8e48d7dd263257"
          test "$(git -C upstream/GSEMO hash-object src/main.cpp)" = "22025e4680da85c98e3bb5ea30db8334ca25dff3"

      - name: Rehydrate historical dependency paths
        run: |
          set -euo pipefail
          test "$(git -C upstream/GSEMO show HEAD:include)" = "/home/jacob/code/IOHexperimenter/include/"
          test "$(git -C upstream/GSEMO show HEAD:external)" = "/home/jacob/code/IOHexperimenter/external/"
          rm upstream/GSEMO/include upstream/GSEMO/external
          cp -R upstream/IOHexperimenter/include upstream/GSEMO/include
          cp -R upstream/IOHexperimenter/external upstream/GSEMO/external

      - name: Apply preregistered additive HYBRID patch
        run: |
          set -euo pipefail
          python candidates/EU26-27/hybrid/patch_upstream.py upstream/GSEMO
          git -C upstream/GSEMO diff --check
          git -C upstream/GSEMO diff -- src/gsemo.hpp src/main.cpp > hybrid.patch
          grep -q 'HybridLambda' upstream/GSEMO/src/gsemo.hpp
          grep -q 'HybridReset' upstream/GSEMO/src/gsemo.hpp
          grep -q 'HybridNoReset' upstream/GSEMO/src/gsemo.hpp
          grep -q 'experiment_seed' upstream/GSEMO/src/main.cpp

      - name: Build patched research executable
        run: |
          set -euo pipefail
          cmake -S upstream/GSEMO -B upstream/GSEMO/build -DCMAKE_BUILD_TYPE=Release
          cmake --build upstream/GSEMO/build --config Release --parallel 2
          BIN="$(find upstream/GSEMO/build -type f -name gsemo | head -n 1)"
          test -n "$BIN"
          echo "AUTHOR_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Regression — patched TwoRate still exactly reproduces canonical OLD
        run: |
          set -euo pipefail
          mkdir old-regression-run evidence/hybrid-old-regression
          (
            cd old-regression-run
            "$GITHUB_WORKSPACE/$AUTHOR_BIN" 1 100 TwoRate 10 1 1 "$SAFETY_CAP_FE" 100 > stdout.txt
          )
          python candidates/EU26-27/source_native/compare_source_native_old_fail_closed.py \
            --author-output-root old-regression-run \
            --output-dir evidence/hybrid-old-regression \
            --gsemo-sha "$GSEMO_SHA" \
            --ioh-sha "$IOH_SHA" \
            --safety-cap-fe "$SAFETY_CAP_FE"

      - name: Smoke HYBRID_RESET and HYBRID_NO_RESET
        run: |
          set -euo pipefail
          for algorithm in HybridReset HybridNoReset; do
            mkdir -p "smoke/$algorithm"
            (
              cd "smoke/$algorithm"
              "$GITHUB_WORKSPACE/$AUTHOR_BIN" 1 20 "$algorithm" 10 1 1 200000 1 27001 > stdout.txt
            )
            test -n "$(find "smoke/$algorithm" -name '*.dat' -type f | head -n 1)"
          done

      - name: Run frozen paired 30-seed OLD / HYBRID_RESET / HYBRID_NO_RESET matrix
        run: |
          set -euo pipefail
          tail -n +2 candidates/EU26-27/hybrid/seeds.csv | while IFS=, read -r run seed; do
            for profile in OLD HYBRID_RESET HYBRID_NO_RESET; do
              case "$profile" in
                OLD) algorithm=TwoRate ;;
                HYBRID_RESET) algorithm=HybridReset ;;
                HYBRID_NO_RESET) algorithm=HybridNoReset ;;
              esac
              out="paired-runs/$profile/seed-$seed"
              mkdir -p "$out"
              (
                cd "$out"
                "$GITHUB_WORKSPACE/$AUTHOR_BIN" 1 100 "$algorithm" 10 1 1 "$SAFETY_CAP_FE" 1 "$seed" > stdout.txt
              )
            done
          done

      - name: Analyze preregistered paired FE hypotheses
        run: |
          set -euo pipefail
          python candidates/EU26-27/hybrid/analyze_paired.py \
            --runs-root paired-runs \
            --seeds candidates/EU26-27/hybrid/seeds.csv \
            --output evidence/hybrid-confirmatory
          cat evidence/hybrid-confirmatory/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: eu26-27-hybrid-confirmatory-evidence
          path: |
            candidates/EU26-27/hybrid/preregistration/PROTOCOL.md
            candidates/EU26-27/hybrid/seeds.csv
            hybrid.patch
            evidence/hybrid-old-regression/report.json
            evidence/hybrid-old-regression/summary.md
            evidence/hybrid-confirmatory/report.json
            evidence/hybrid-confirmatory/summary.md
            evidence/hybrid-confirmatory/paired_endpoints.csv
            evidence/hybrid-confirmatory/paired_fe.svg
            paired-runs/**/*.json
            paired-runs/**/*.dat
          if-no-files-found: warn
          retention-days: 90
