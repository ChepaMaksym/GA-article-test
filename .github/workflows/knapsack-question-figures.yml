name: Question-led knapsack figures from frozen evidence

on:
  push:
    branches: [research/masters-ga-knapsack-parameters]

permissions:
  contents: read

concurrency:
  group: knapsack-figures-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  render:
    if: contains(github.event.head_commit.message, '[knapsack-figures:render]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install unchanged hash-frozen environment
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Verify presentation contracts and negative fixtures
        run: >-
          python -m unittest discover -s studies/knapsack_parameters/visual_review/tests
          -p 'test_*.py' -v
      - name: Verify immutable inputs and render existing evidence
        run: >-
          python -m studies.knapsack_parameters.visual_review.build
          --expected-sha '${{ github.sha }}' --output '${{ runner.temp }}/knapsack-question-figures'
      - name: Ensure checkout and historical evidence remain unchanged
        if: always()
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knapsack-question-figures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/knapsack-question-figures
          retention-days: 90
          if-no-files-found: error
