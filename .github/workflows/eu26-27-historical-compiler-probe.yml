name: EU26-27 historical compiler probe

on:
  workflow_dispatch:
  pull_request:
    branches:
      - research/EU26-07-reset-jump-verification
    paths:
      - 'candidates/EU26-27/source_native/diagnose_historical_environment.py'
      - 'candidates/EU26-27/preregistration/HISTORICAL_ENVIRONMENT_RECOVERY.md'
      - '.github/workflows/eu26-27-historical-compiler-probe.yml'
  push:
    branches:
      - research/EU26-27-agsemo-recovery
    paths:
      - 'candidates/EU26-27/source_native/diagnose_historical_environment.py'
      - 'candidates/EU26-27/preregistration/HISTORICAL_ENVIRONMENT_RECOVERY.md'
      - '.github/workflows/eu26-27-historical-compiler-probe.yml'

concurrency:
  group: eu26-27-historical-compiler-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GSEMO_SHA: fbe1d3ed3064dedd85ba3c5eaf78fe4ea3d6b380
  IOH_SHA: f223c682dff0749067d00b870f83ad754f7d96f5

jobs:
  compiler-probe:
    name: Historical libstdc++ / GCC${{ matrix.gcc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Outcome-blind historical window. GCC 9-13 covers the libstdc++
        # generations plausibly used by a Linux research workstation during
        # the 2020-2023 implementation/data-generation period. GCC 7/8 were
        # already probed and are source-incompatible with the frozen C++17 tree.
        gcc: ['9', '10', '11', '12', '13']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Fetch exact frozen source and dependency
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          mkdir -p upstream
          git clone --filter=blob:none https://github.com/FurongYe/GSEMO.git upstream/GSEMO
          git -C upstream/GSEMO checkout --detach "$GSEMO_SHA"
          git clone --filter=blob:none https://github.com/IOHprofiler/IOHexperimenter.git upstream/IOHexperimenter
          git -C upstream/IOHexperimenter checkout --detach "$IOH_SHA"
          git -C upstream/IOHexperimenter submodule sync --recursive
          git -C upstream/IOHexperimenter submodule update --init --recursive
          test "$(git -C upstream/GSEMO rev-parse HEAD)" = "$GSEMO_SHA"
          test "$(git -C upstream/IOHexperimenter rev-parse HEAD)" = "$IOH_SHA"
          test "$(cat upstream/IOHexperimenter/VERSION)" = "0.3.9"
          test "$(git -C upstream/GSEMO hash-object src/gsemo.hpp)" = "2693144bcfccff902343a02c6c8e48d7dd263257"
          test "$(git -C upstream/GSEMO hash-object src/main.cpp)" = "22025e4680da85c98e3bb5ea30db8334ca25dff3"
          test "$(git -C upstream/GSEMO hash-object src/problems.cpp)" = "cd9b520253e3b0b0390e35bf4fb86d4249c204de"
          rm upstream/GSEMO/include upstream/GSEMO/external
          cp -R upstream/IOHexperimenter/include upstream/GSEMO/include
          cp -R upstream/IOHexperimenter/external upstream/GSEMO/external

      - name: Build and run exact OLD under GCC${{ matrix.gcc }} libstdc++
        shell: bash
        env:
          GCC_MAJOR: ${{ matrix.gcc }}
        run: |
          set -euo pipefail
          mkdir -p "env-runs/gcc${GCC_MAJOR}" "env-bin/gcc${GCC_MAJOR}"
          docker pull "gcc:${GCC_MAJOR}"
          docker image inspect "gcc:${GCC_MAJOR}" --format '{{index .RepoDigests 0}}' > "env-runs/gcc${GCC_MAJOR}/compiler-image.txt"
          docker run --rm \
            -e GCC_MAJOR="$GCC_MAJOR" \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "gcc:${GCC_MAJOR}" \
            bash -lc '
              set -euo pipefail
              g++ --version | tee "/work/env-runs/gcc${GCC_MAJOR}/compiler.txt"
              g++ -std=c++17 -O3 -DNDEBUG \
                -I/work/upstream/GSEMO/include \
                -I/work/upstream/GSEMO/src \
                -I/work/upstream/GSEMO/external/fmt/include \
                -I/work/upstream/GSEMO/external/cxxopts/include \
                -I/work/upstream/GSEMO/external/json/include \
                /work/upstream/GSEMO/src/problems.cpp \
                /work/upstream/GSEMO/src/main.cpp \
                -o "/work/env-bin/gcc${GCC_MAJOR}/gsemo"
              cd "/work/env-runs/gcc${GCC_MAJOR}"
              "/work/env-bin/gcc${GCC_MAJOR}/gsemo" 1 100 TwoRate 10 1 1 100000 100 > stdout.txt
              test -n "$(find . -name "*.json" -type f | head -n 1)"
            '

      - name: Verify algorithm source was not modified
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream/GSEMO hash-object src/gsemo.hpp)" = "2693144bcfccff902343a02c6c8e48d7dd263257"
          test "$(git -C upstream/GSEMO hash-object src/main.cpp)" = "22025e4680da85c98e3bb5ea30db8334ca25dff3"
          test "$(git -C upstream/GSEMO hash-object src/problems.cpp)" = "cd9b520253e3b0b0390e35bf4fb86d4249c204de"

      - name: Diagnose exact Zenodo replay without aborting mismatches
        shell: bash
        env:
          GCC_MAJOR: ${{ matrix.gcc }}
        run: |
          set -euo pipefail
          python candidates/EU26-27/source_native/diagnose_historical_environment.py \
            --author-output-root "env-runs/gcc${GCC_MAJOR}" \
            --output-dir "evidence/historical-gcc${GCC_MAJOR}" \
            --compiler-label "GCC${GCC_MAJOR}" \
            --gsemo-sha "$GSEMO_SHA" \
            --ioh-sha "$IOH_SHA"
          cat "evidence/historical-gcc${GCC_MAJOR}/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: eu26-27-historical-gcc${{ matrix.gcc }}
          path: |
            evidence/historical-gcc${{ matrix.gcc }}/report.json
            evidence/historical-gcc${{ matrix.gcc }}/summary.md
            evidence/historical-gcc${{ matrix.gcc }}/SHA256SUMS.json
            env-runs/gcc${{ matrix.gcc }}/compiler.txt
            env-runs/gcc${{ matrix.gcc }}/compiler-image.txt
            env-runs/gcc${{ matrix.gcc }}/stdout.txt
            env-runs/gcc${{ matrix.gcc }}/**/*.json
            env-runs/gcc${{ matrix.gcc }}/**/*.dat
          if-no-files-found: error
          retention-days: 90
