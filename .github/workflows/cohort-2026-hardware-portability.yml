name: Cohort 2026 hardware portability

on:
  workflow_dispatch:
  push:
    branches:
      - research/cohort-2026-12
    paths:
      - "candidates/USA26-01/environments/python/**"
      - "candidates/USA26-01/config/hardware_smoke_matrix.csv"
      - "candidates/USA26-01/preregistration/hardware_portability_contract.md"
      - "candidates/USA26-01/tests/hardware/**"
      - ".github/workflows/cohort-2026-hardware-portability.yml"

permissions:
  contents: read

jobs:
  github-four-core:
    name: GitHub 4-vCPU portability profile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - name: Check out the frozen branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: candidates/USA26-01/environments/python/requirements.txt
      - name: Install the pinned numerical dependency
        run: python -m pip install --requirement candidates/USA26-01/environments/python/requirements.txt
      - name: Record runner hardware
        run: |
          lscpu
          cat /proc/cpuinfo
          cat /sys/fs/cgroup/cpu.max || true
          cat /sys/fs/cgroup/cpuset.cpus.effective || true
      - name: Run formula and property gates
        run: python candidates/USA26-01/tests/run_python_tests.py
      - name: Run the frozen 4-vCPU profile
        run: |
          python candidates/USA26-01/tests/hardware/run_portability_suite.py \
            --label github-4core-x64 \
            --workers 4 \
            --logical-cpus 4 \
            --timing-repeats 5 \
            --output hardware-artifacts/github-4core.json \
            --hashes hardware-artifacts/github-4core-hashes.tsv
      - name: Upload the immutable profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesmr-github-4core-profile
          path: hardware-artifacts/
          if-no-files-found: error
          retention-days: 30
