name: Knapsack 100-item comparison - complete fourteen missing cases

on:
  push:
    branches: [research/population100-completion-20261110]
    paths:
      - studies/knapsack_parameters/population_validation_100_completion/**
      - .github/workflows/population-validation-100-completion.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: population100-completion-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MPLBACKEND: Agg

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Verify continuation admission rules
        run: python -m unittest studies.knapsack_parameters.population_validation_100_completion.test_completion -v
      - name: Authenticate original archives and retain exact starting banks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m studies.knapsack_parameters.population_validation_100_completion.evidence --out "$RUNNER_TEMP/evidence"
      - name: Validate completed cases and freeze only missing identities
        run: python -m studies.knapsack_parameters.population_validation_100_completion.runner prepare --prepared "$RUNNER_TEMP/evidence/prepared" --compacts "$RUNNER_TEMP/evidence/compacts" --out "$RUNNER_TEMP/evidence/ledger"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: population100-completion-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30
          if-no-files-found: error

  recover:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix: {family: [s050, s055, s058, s059]}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: population100-completion-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
      - name: Execute and independently replay only absent cases
        run: python -m studies.knapsack_parameters.population_validation_100_completion.runner recover --prepared "$RUNNER_TEMP/evidence/prepared" --ledger "$RUNNER_TEMP/evidence/ledger/ledger.json" --family ${{ matrix.family }} --out "$RUNNER_TEMP/raw" --compact-out "$RUNNER_TEMP/compact"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: population100-completion-raw-${{ matrix.family }}-${{ github.run_id }}
          path: ${{ runner.temp }}/raw
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: population100-completion-compact-${{ matrix.family }}-${{ github.run_id }}
          path: ${{ runner.temp }}/compact
          retention-days: 30
          if-no-files-found: warn

  analysis:
    needs: recover
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: population100-completion-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: population100-completion-compact-*-${{ github.run_id }}
          path: ${{ runner.temp }}/completion-compacts
      - name: Verify all nine hundred cases and compute registered comparisons
        run: python -m studies.knapsack_parameters.population_validation_100_completion.analysis --prepared "$RUNNER_TEMP/evidence/prepared" --original-compacts "$RUNNER_TEMP/evidence/compacts" --completion-compacts "$RUNNER_TEMP/completion-compacts" --ledger "$RUNNER_TEMP/evidence/ledger/ledger.json" --out "$RUNNER_TEMP/analysis"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: population100-completion-analysis-${{ github.run_id }}
          path: ${{ runner.temp }}/analysis
          retention-days: 30
          if-no-files-found: error
