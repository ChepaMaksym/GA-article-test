name: Knapsack initial grid 100 - synthetic aggregation check

on:
  push:
    branches: [research/initial-grid100-qc-20261110]
    paths:
      - studies/knapsack_parameters/initial_grid_100_qc/**
      - .github/workflows/initial-grid-100-qc.yml

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MPLBACKEND: Agg

jobs:
  synthetic-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Validate complete and incomplete synthetic grids without GA search
        run: |
          python -m unittest studies.knapsack_parameters.initial_grid_100_qc.test_full_analysis -v
