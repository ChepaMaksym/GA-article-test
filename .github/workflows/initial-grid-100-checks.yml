name: Knapsack initial grid 100 - retained input checks only

on:
  push:
    branches: [research/initial-grid100-checks-20261110]
    paths:
      - studies/knapsack_parameters/initial_grid_100/**
      - .github/workflows/initial-grid-100-checks.yml

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MPLBACKEND: Agg

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Verify prospective schedule and exact tie rules
        run: |
          python -m unittest studies.knapsack_parameters.initial_grid_100.test_tuning studies.knapsack_parameters.initial_grid_100.test_run_tuning -v
      - name: Audit retained inputs and construct a non-executable schedule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m studies.knapsack_parameters.initial_grid_100.retained_tuning --audit-only --out "$RUNNER_TEMP/retained"
          python -m studies.knapsack_parameters.initial_grid_100.prepare_tuning --audit-only --retained "$RUNNER_TEMP/retained" --out "$RUNNER_TEMP/audit"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: initial-grid100-reuse-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/audit
          retention-days: 30
          if-no-files-found: error
