name: EU26-21 CHC-QX Census OLD validation

on:
  workflow_dispatch:
  push:
    branches: [research/EU26-21-chcqx-census-old-first]
    paths:
      - 'candidates/EU26-21/**'
      - '.github/workflows/eu26-21-old-validation.yml'
  pull_request:
    paths:
      - 'candidates/EU26-21/**'
      - '.github/workflows/eu26-21-old-validation.yml'

concurrency:
  group: eu26-21-old-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UPSTREAM_REPO: https://github.com/Ghaith81/Fast-Genetic-Algorithm-For-Feature-Selection.git
  UPSTREAM_COMMIT: 6ac5a7ec77f8a7c096ab4d019254fcc897988fd6
  PYTHONHASHSEED: '0'
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  old-contract:
    name: OLD provenance, artifact, and HYBRID gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact author snapshot
        run: |
          git init "${RUNNER_TEMP}/chcqx"
          git -C "${RUNNER_TEMP}/chcqx" remote add origin "$UPSTREAM_REPO"
          git -C "${RUNNER_TEMP}/chcqx" fetch --depth=1 origin "$UPSTREAM_COMMIT"
          git -C "${RUNNER_TEMP}/chcqx" checkout --detach FETCH_HEAD
          test "$(git -C "${RUNNER_TEMP}/chcqx" rev-parse HEAD)" = "$UPSTREAM_COMMIT"
      - name: Authenticate source, data, and executed notebook endpoint
        run: python candidates/EU26-21/old/source_audit.py "${RUNNER_TEMP}/chcqx"
      - name: Enforce documentation-only HYBRID
        run: |
          test -f candidates/EU26-21/hybrid/README.md
          count=$(find candidates/EU26-21/hybrid -type f ! -name README.md | wc -l)
          test "$count" -eq 0

  source-unit:
    name: Pinned CHC adaptive fixed-tape and campaign tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install frozen author-source environment
        run: >-
          python -m pip install
          numpy==1.23.5 pandas==1.5.3 scipy==1.10.1 scikit-learn==1.2.2
          matplotlib==3.7.5 deap==1.3.3 pyswarms==1.3.0
      - name: Verify numerical campaign gates fail closed
        run: python candidates/EU26-21/tests/test_source_campaign.py
      - name: Fetch exact author snapshot
        run: |
          git init "${RUNNER_TEMP}/chcqx"
          git -C "${RUNNER_TEMP}/chcqx" remote add origin "$UPSTREAM_REPO"
          git -C "${RUNNER_TEMP}/chcqx" fetch --depth=1 origin "$UPSTREAM_COMMIT"
          git -C "${RUNNER_TEMP}/chcqx" checkout --detach FETCH_HEAD
          test "$(git -C "${RUNNER_TEMP}/chcqx" rev-parse HEAD)" = "$UPSTREAM_COMMIT"
      - name: Verify pinned HUX, adaptive distance, and cataclysmic restart
        run: python candidates/EU26-21/tests/test_upstream_source.py "${RUNNER_TEMP}/chcqx"

  source-smoke:
    name: Pinned Census CHC-QX seed 1
    needs: [old-contract, source-unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install frozen author-source environment
        run: >-
          python -m pip install
          numpy==1.23.5 pandas==1.5.3 scipy==1.10.1 scikit-learn==1.2.2
          matplotlib==3.7.5 deap==1.3.3 pyswarms==1.3.0
      - name: Fetch exact author snapshot
        run: |
          git init "${RUNNER_TEMP}/chcqx"
          git -C "${RUNNER_TEMP}/chcqx" remote add origin "$UPSTREAM_REPO"
          git -C "${RUNNER_TEMP}/chcqx" fetch --depth=1 origin "$UPSTREAM_COMMIT"
          git -C "${RUNNER_TEMP}/chcqx" checkout --detach FETCH_HEAD
          test "$(git -C "${RUNNER_TEMP}/chcqx" rev-parse HEAD)" = "$UPSTREAM_COMMIT"
      - name: Execute structured source smoke endpoint
        run: |
          python candidates/EU26-21/old/run_source_census.py \
            "${RUNNER_TEMP}/chcqx" \
            --seed 1 \
            --output-json "${RUNNER_TEMP}/eu26-21-source-seed1.json" \
            --log-file "${RUNNER_TEMP}/eu26-21-source-seed1.log"
          cat "${RUNNER_TEMP}/eu26-21-source-seed1.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eu26-21-source-seed1
          path: |
            ${{ runner.temp }}/eu26-21-source-seed1.json
            ${{ runner.temp }}/eu26-21-source-seed1.log
          if-no-files-found: warn
          retention-days: 30

  source-ten-run-campaign:
    name: Pinned ten-seed Census CHC-QX campaign
    needs: [old-contract, source-unit, source-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install frozen author-source environment
        run: >-
          python -m pip install
          numpy==1.23.5 pandas==1.5.3 scipy==1.10.1 scikit-learn==1.2.2
          matplotlib==3.7.5 deap==1.3.3 pyswarms==1.3.0
      - name: Fetch exact author snapshot
        run: |
          git init "${RUNNER_TEMP}/chcqx"
          git -C "${RUNNER_TEMP}/chcqx" remote add origin "$UPSTREAM_REPO"
          git -C "${RUNNER_TEMP}/chcqx" fetch --depth=1 origin "$UPSTREAM_COMMIT"
          git -C "${RUNNER_TEMP}/chcqx" checkout --detach FETCH_HEAD
          test "$(git -C "${RUNNER_TEMP}/chcqx" rev-parse HEAD)" = "$UPSTREAM_COMMIT"
      - name: Execute and enforce preregistered source campaign
        run: |
          python candidates/EU26-21/old/run_source_campaign.py \
            "${RUNNER_TEMP}/chcqx" \
            --output-dir "${RUNNER_TEMP}/eu26-21-source-campaign" \
            --output-json "${RUNNER_TEMP}/eu26-21-source-campaign.json" \
            --timeout-per-run 900 \
            --enforce-reproduction
      - name: Print compact scientific verdict
        if: always()
        run: |
          if test -f "${RUNNER_TEMP}/eu26-21-source-campaign.json"; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'eu26-21-source-campaign.json').read_text()
          )
          print(json.dumps({
              'claim_status': report['claim_status'],
              'gates': {key: value['pass'] for key, value in report.get('gates', {}).items()},
              'statistics': report.get('statistics'),
              'error': report.get('error'),
          }, sort_keys=True))
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eu26-21-source-ten-run-campaign
          path: |
            ${{ runner.temp }}/eu26-21-source-campaign.json
            ${{ runner.temp }}/eu26-21-source-campaign
          if-no-files-found: warn
          retention-days: 30
