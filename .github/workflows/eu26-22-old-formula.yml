name: EU26-22 OLD formula and portability

on:
  pull_request:
    paths:
      - "candidates/EU26-22/**"
      - ".github/workflows/eu26-22-old-formula.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.10"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: candidates/EU26-22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q
      - shell: bash
        run: |
          set -euo pipefail
          for workers in 1 2 4; do
            python -m old.portability_probe --workers "$workers" > "probe-${workers}.json"
          done
          python - <<'PY'
          import json
          rows=[json.load(open(f"probe-{w}.json")) for w in (1,2,4)]
          digests={row["sha256"] for row in rows}
          assert len(digests)==1, rows
          print("PASS_WORKER_INVARIANCE", rows[0]["sha256"])
          PY
