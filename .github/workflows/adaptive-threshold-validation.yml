name: Adaptive mechanisms and threshold validation
on:
  push:
    branches: [research/adaptive-threshold-validation]
    paths: [studies/knapsack_parameters/adaptive_threshold_validation/pilot-request.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-adaptive-threshold-validation
  cancel-in-progress: false
env:
  STUDY: studies.knapsack_parameters.adaptive_threshold_validation
  PKG: studies/knapsack_parameters/adaptive_threshold_validation
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  pilot:
    if: github.ref == 'refs/heads/research/adaptive-threshold-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pc: [90,100]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install frozen dependencies
        run: python -m pip install --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Verify registration and run compatibility checks
        run: |
          python -m "$STUDY.study" freeze > registered.json
          cmp "$PKG/registered.json" registered.json
          python -m unittest -v "$STUDY.test_pilot"
      - name: Run and independently replay technical cases
        run: python -m "$STUDY.study" pilot --pc ${{ matrix.pc }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: adaptive-pilot-${{ matrix.pc }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            registered.json
          if-no-files-found: error
          retention-days: 7
