name: Knapsack stagnation diagnosis - bounded technical stage

on:
  push:
    branches: [research/masters-ga-diversity-crossover]

permissions:
  contents: read
  actions: read

concurrency:
  group: knapsack-stagnation-diagnosis-budget
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.sha }}
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  GITHUB_TOKEN: ${{ github.token }}
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  gate:
    if: contains(github.event.head_commit.message, '[knapsack-stagnation:')
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      phase: ${{ steps.authority.outputs.phase }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact phase and cumulative independent grant
        id: authority
        run: |
          PHASE=$(python3 -c 'import os; from studies.knapsack_parameters.stagnation_diagnosis.contract import phase; print(phase(os.environ["COMMIT_MESSAGE"]))')
          python3 -m studies.knapsack_parameters.stagnation_diagnosis.execution gate --phase "$PHASE" --output "$RUNNER_TEMP/permit"
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knapsack-stagnation-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permit
          if-no-files-found: warn
          retention-days: 90

  tests:
    needs: gate
    if: needs.gate.outputs.phase == 'tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Exact hash-locked numerical environment
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Authenticate current-run central reservation
        run: python -m studies.knapsack_parameters.stagnation_diagnosis.execution download --kind permit --output "$RUNNER_TEMP/permit"
      - name: New adversarial fixtures and unchanged historical regression checks
        run: python -m studies.knapsack_parameters.stagnation_diagnosis.execution tests --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/tests"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knapsack-stagnation-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tests
          if-no-files-found: warn
          retention-days: 90

  prepare:
    needs: gate
    if: needs.gate.outputs.phase == 'prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Exact hash-locked numerical environment
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Authenticate current-run central reservation
        run: python -m studies.knapsack_parameters.stagnation_diagnosis.execution download --kind permit --output "$RUNNER_TEMP/permit"
      - name: Prepare and independently verify all 903 fixed beginnings - no search
        run: python -m studies.knapsack_parameters.stagnation_diagnosis.execution prepare --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/prepare"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knapsack-stagnation-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepare
          if-no-files-found: warn
          retention-days: 90

  probe:
    needs: gate
    if: needs.gate.outputs.phase == 'probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        instance: [UC-s000, SC-s005, SC-s000]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Exact hash-locked numerical environment
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Authenticate current-run central reservation
        run: python -m studies.knapsack_parameters.stagnation_diagnosis.execution download --kind permit --output "$RUNNER_TEMP/permit"
      - name: One fixed resource probe - persist raw before independent replay
        env:
          PROBE_INSTANCE: ${{ matrix.instance }}
        run: python -m studies.knapsack_parameters.stagnation_diagnosis.execution worker --instance-id "$PROBE_INSTANCE" --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/worker"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knapsack-stagnation-worker-${{ matrix.instance }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    needs: [gate, probe]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.phase == 'probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Exact hash-locked numerical environment
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Authenticate current-run central reservation
        run: python -m studies.knapsack_parameters.stagnation_diagnosis.execution download --kind permit --output "$RUNNER_TEMP/permit"
      - name: Authenticated complete worker transport - retain partial failures
        continue-on-error: true
        run: python -m studies.knapsack_parameters.stagnation_diagnosis.execution download --kind workers --output "$RUNNER_TEMP/workers"
      - name: Independently replay stored evidence and measure the main-series quote
        run: python -m studies.knapsack_parameters.stagnation_diagnosis.execution aggregate --permit "$RUNNER_TEMP/permit" --artifacts "$RUNNER_TEMP/workers" --output "$RUNNER_TEMP/summary"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knapsack-stagnation-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/summary
          if-no-files-found: warn
          retention-days: 90
