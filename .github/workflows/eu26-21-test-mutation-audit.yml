name: EU26-21 deliberate-mutant test sensitivity audit

on:
  workflow_dispatch:
  push:
    branches: [research/EU26-21-chcqx-census-old-first]
    paths:
      - 'candidates/EU26-21/hybrid_1/core.py'
      - 'candidates/EU26-21/hybrid_1/mutation_sensitivity_audit.py'
      - 'candidates/EU26-21/tests/test_hybrid_1_core.py'
      - 'candidates/EU26-21/tests/test_hybrid_1_core_semantics_extended.py'
      - '.github/workflows/eu26-21-test-mutation-audit.yml'
  pull_request:
    paths:
      - 'candidates/EU26-21/hybrid_1/core.py'
      - 'candidates/EU26-21/hybrid_1/mutation_sensitivity_audit.py'
      - 'candidates/EU26-21/tests/test_hybrid_1_core.py'
      - 'candidates/EU26-21/tests/test_hybrid_1_core_semantics_extended.py'
      - '.github/workflows/eu26-21-test-mutation-audit.yml'

concurrency:
  group: eu26-21-test-mutation-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  mutation-sensitivity:
    name: Kill six deliberate critical-code mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - name: Install frozen test environment
        run: python -m pip install -r candidates/EU26-21/hybrid_1/requirements.txt
      - name: Require the unmodified baseline to pass and every mutant to fail
        run: |
          python candidates/EU26-21/hybrid_1/mutation_sensitivity_audit.py \
            --root . \
            --output-json "${RUNNER_TEMP}/mutation-audit.json" \
            --enforce
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: eu26-21-test-mutation-audit
          path: ${{ runner.temp }}/mutation-audit.json
          if-no-files-found: warn
          retention-days: 90
