name: Knapsack stagnation - approved three-family recovery

on:
  push:
    branches: [research/masters-ga-diversity-crossover]

permissions:
  contents: read
  actions: read

concurrency:
  group: knapsack-stagnation-recovery-shared-budget
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.sha }}
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  GITHUB_TOKEN: ${{ github.token }}
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  gate:
    if: contains(github.event.head_commit.message, '[knapsack-stagnation-recovery:')
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      phase: ${{ steps.authority.outputs.phase }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Explicit recovery permission and combined original plus recovery usage
        id: authority
        run: |
          PHASE=$(python3 -c 'import os; from studies.knapsack_parameters.stagnation_mechanisms_recovery.contract import phase; print(phase(os.environ["COMMIT_MESSAGE"]))')
          python3 -m studies.knapsack_parameters.stagnation_mechanisms_recovery.execution gate --phase "$PHASE" --output "$RUNNER_TEMP/permit"
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knapsack-stagnation-recovery-permit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/permit
          if-no-files-found: warn
          retention-days: 90

  tests:
    needs: gate
    if: needs.gate.outputs.phase == 'tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Hash-locked environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Retrieve exact permit
        run: python -m studies.knapsack_parameters.stagnation_mechanisms_recovery.execution download --kind permit --output "$RUNNER_TEMP/permit"
      - name: Original scientific checks plus recovery authority and rendering
        run: python -m studies.knapsack_parameters.stagnation_mechanisms_recovery.execution tests --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/tests"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knapsack-stagnation-recovery-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tests
          if-no-files-found: warn
          retention-days: 90

  worker:
    name: worker (${{ matrix.family }})
    needs: gate
    if: needs.gate.outputs.phase == 'recover'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        family: [s004, s005, s006]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Hash-locked environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Retrieve exact permit
        run: python -m studies.knapsack_parameters.stagnation_mechanisms_recovery.execution download --kind permit --output "$RUNNER_TEMP/permit"
      - name: Replay only a missing family and retain completed records incrementally
        env:
          RECOVERY_FAMILY: ${{ matrix.family }}
        run: python -m studies.knapsack_parameters.stagnation_mechanisms_recovery.execution worker --family "$RECOVERY_FAMILY" --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/worker"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knapsack-stagnation-recovery-worker-${{ matrix.family }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    needs: [gate, worker]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.phase == 'recover'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Hash-locked environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Retrieve exact permit
        run: python -m studies.knapsack_parameters.stagnation_mechanisms_recovery.execution download --kind permit --output "$RUNNER_TEMP/permit"
      - name: Retrieve all available recovery workers
        continue-on-error: true
        run: python -m studies.knapsack_parameters.stagnation_mechanisms_recovery.execution download --kind workers --output "$RUNNER_TEMP/workers"
      - name: Reuse seven exact artifacts, verify the explicit producer map and summarize 900 runs
        run: python -m studies.knapsack_parameters.stagnation_mechanisms_recovery.execution aggregate --permit "$RUNNER_TEMP/permit" --artifacts "$RUNNER_TEMP/workers" --output "$RUNNER_TEMP/summary"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knapsack-stagnation-recovery-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/summary
          if-no-files-found: warn
          retention-days: 90

  presentation:
    needs: gate
    if: needs.gate.outputs.phase == 'present'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Hash-locked environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Retrieve exact permit
        run: python -m studies.knapsack_parameters.stagnation_mechanisms_recovery.execution download --kind permit --output "$RUNNER_TEMP/permit"
      - name: Correct label association from the frozen completed summary only
        run: python -m studies.knapsack_parameters.stagnation_mechanisms_recovery.execution present --permit "$RUNNER_TEMP/permit" --output "$RUNNER_TEMP/presentation"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knapsack-stagnation-recovery-summary-presentation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/presentation
          if-no-files-found: warn
          retention-days: 90
