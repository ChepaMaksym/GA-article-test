name: USA26-09 source-tree preconfirmatory validation

on:
  workflow_dispatch:
  push:
    branches: [research/USA26-09-mtsp-hga-old-first]
    paths:
      - 'candidates/USA26-09/**'
      - '.github/workflows/usa26-09-validation.yml'

concurrency:
  group: usa26-09-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  cross-platform:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / workers ${{ matrix.workers }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11', workers: 1}
          - {os: ubuntu-24.04, python: '3.12', workers: 2}
          - {os: ubuntu-24.04, python: '3.13', workers: 4}
          - {os: macos-14, python: '3.11', workers: 4}
          - {os: macos-14, python: '3.12', workers: 1}
          - {os: macos-14, python: '3.13', workers: 2}
          - {os: windows-2022, python: '3.11', workers: 2}
          - {os: windows-2022, python: '3.12', workers: 4}
          - {os: windows-2022, python: '3.13', workers: 1}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install reconstructed candidate
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'candidates/USA26-09/implementation[test]'
          python -m pip check
      - name: Complete tests
        shell: bash
        run: python -m pytest candidates/USA26-09/implementation/tests -q
      - name: Pilot-only worker profile
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/usa26-09"
          cd candidates/USA26-09/implementation
          python scripts/ci_profile.py --workers '${{ matrix.workers }}' --output "${RUNNER_TEMP}/usa26-09/profile.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: usa26-09-${{ matrix.os }}-py${{ matrix.python }}-w${{ matrix.workers }}
          path: ${{ runner.temp }}/usa26-09
          if-no-files-found: error
          retention-days: 90
