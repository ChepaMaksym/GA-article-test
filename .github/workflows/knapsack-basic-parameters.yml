name: Knapsack basic parameters

on:
  push:
    branches: [research/masters-ga-diversity-crossover]

permissions:
  contents: read
  actions: read

concurrency:
  group: knapsack-basic-parameters
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.sha }}
  GITHUB_TOKEN: ${{ github.token }}
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  gate:
    if: contains(github.event.head_commit.message, '[basic-parameters:')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      phase: ${{ steps.gate.outputs.phase }}
      matrix: ${{ steps.gate.outputs.matrix }}
      timeout: ${{ steps.gate.outputs.timeout }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: gate
        name: Exact SHA, isolated authority, all-attempt budget reservation
        run: python3 -m studies.knapsack_parameters.basic_parameters.driver gate --output "$RUNNER_TEMP/gate"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: basic-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate
          if-no-files-found: warn
          retention-days: 90

  phase:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.gate.outputs.timeout) }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Hash-locked environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Registered phase only
        env:
          STUDY_PHASE: ${{ needs.gate.outputs.phase }}
          STUDY_TASK: ${{ matrix.task }}
        run: python -m studies.knapsack_parameters.basic_parameters.driver execute --output "$RUNNER_TEMP/full" --compact "$RUNNER_TEMP/compact"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: basic-full-${{ needs.gate.outputs.phase }}-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: basic-compact-${{ needs.gate.outputs.phase }}-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compact
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    needs: [gate, phase]
    if: always() && needs.gate.result == 'success' && (needs.gate.outputs.phase == 'pilot' || needs.gate.outputs.phase == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Hash-locked environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r studies/knapsack_parameters/ga_study/dependencies/requirements.lock
      - name: Verify all jobs and compact artifacts before analysis
        env:
          STUDY_PHASE: ${{ needs.gate.outputs.phase }}
        run: python -m studies.knapsack_parameters.basic_parameters.driver aggregate --output "$RUNNER_TEMP/report"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: basic-report-${{ needs.gate.outputs.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report
          if-no-files-found: warn
          retention-days: 90
