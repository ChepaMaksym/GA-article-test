name: EU26-21 common bridge lightweight contract CI

on:
  workflow_dispatch:
  push:
    branches: [research/EU26-21-chcqx-census-old-first]
    paths:
      - 'candidates/EU26-21/common_bridge/**'
      - 'candidates/EU26-21/tests/test_common_bridge.py'
      - 'candidates/EU26-21/tests/test_bridge_*.py'
      - 'candidates/EU26-21/corrected_applied/data_protocol.py'
      - 'candidates/EU26-21/corrected_applied/requirements.txt'
      - 'candidates/EU26-21/hybrid_1/core.py'
      - '.github/workflows/eu26-21-common-bridge-ci.yml'
      - '.github/workflows/eu26-21-common-bridge-30-paired.yml'
      - '.github/workflows/eu26-21-common-bridge-reaggregate.yml'

concurrency:
  group: eu26-21-common-bridge-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  contract:
    name: Protocol, unit, and static workflow contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install the frozen corrected bridge environment
        run: |
          python -m pip install -r candidates/EU26-21/corrected_applied/requirements.txt
          python -m pip check
      - name: Validate the prospective protocol contract
        run: >-
          python candidates/EU26-21/common_bridge/validate_protocol.py
          --protocol candidates/EU26-21/common_bridge/protocol.json
          --document candidates/EU26-21/common_bridge/PROTOCOL.md
          --output "${{ runner.temp }}/common-bridge-ci/protocol-validation.json"
      - name: Validate workflow orchestration without running an optimizer
        run: >-
          python candidates/EU26-21/common_bridge/validate_workflows.py
          --root .
          --output "${{ runner.temp }}/common-bridge-ci/workflow-validation.json"
      - name: Run lightweight common-bridge unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/candidates/EU26-21
        run: >-
          python -m unittest
          candidates/EU26-21/tests/test_common_bridge.py
          candidates/EU26-21/tests/test_bridge_evidence.py
          candidates/EU26-21/tests/test_bridge_statistics.py
          -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: eu26-21-common-bridge-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/common-bridge-ci
          if-no-files-found: error
          retention-days: 90
