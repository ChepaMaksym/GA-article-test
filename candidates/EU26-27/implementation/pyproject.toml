[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eu2627-gsemo"
version = "0.1.0"
description = "Clean-room OLD-first verification of two-rate GSEMO on OneMinMax"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.6"]
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest==8.4.2", "coverage==7.10.7"]

[tool.setuptools.packages.find]
where = ["src"]
